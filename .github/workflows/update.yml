name: 리버풀 소식 업데이트

on:
  schedule:
    - cron: "7 * * * *"  # 매시 7분 (GitHub 사정에 따라 몇 분~수십 분 늦어질 수 있음)
  workflow_dispatch:      # Actions 화면에서 "Run workflow" 버튼으로 바로 실행
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 한 번 번역한 제목을 다음 실행에서도 다시 쓰기 위한 저장소
      - uses: actions/cache@v4
        with:
          path: cache
          key: translations-${{ github.run_id }}
          restore-keys: translations-

      - run: pip install -r requirements.txt

      - name: 소식 모으기
        env:
          SITE_CODE: ${{ secrets.SITE_CODE }}
        run: |
          # 접속 코드가 없으면 잠기지 않은 사이트가 올라가므로 여기서 멈춘다
          if [ -z "$SITE_CODE" ]; then
            echo "::error::저장소 Settings > Secrets and variables > Actions 에 SITE_CODE 를 등록해야 합니다."
            exit 1
          fi
          python build.py

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # 공개 저장소는 60일 동안 커밋이 없으면 GitHub가 예약 실행을 멈추므로, 40일마다 빈 커밋을 남긴다
      - name: 자동 실행 중지 방지
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
