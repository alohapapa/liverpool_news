<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-title" content="리버풀 소식">
<title>리버풀 소식</title>
<link rel="icon" href="https://a.espncdn.com/i/teamlogos/soccer/500/364.png">
<link rel="apple-touch-icon" href="https://a.espncdn.com/i/teamlogos/soccer/500/364.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 리버풀 공식 색: 레드 #C8102E · 청록 #00B2A9 · 노랑 #F6EB61 */
  :root {
    --red: #c8102e; --red-deep: #8a0a1f; --red-ink: #c8102e; --teal: #00a39b; --yellow: #f6eb61;
    --bg: #f5f2ef; --card: #ffffff; --text: #1c1516; --muted: #75696a; --line: #ebe4e1;
    --red-soft: #fcebee; --good: #11845b; --good-soft: #def3ea; --warn: #9a6a00; --warn-soft: #fbf1d6;
    --bad: #c8102e; --bad-soft: #fcebee; --shadow: 0 1px 2px rgba(60, 10, 20, .06), 0 6px 20px rgba(60, 10, 20, .06);
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #120c0d; --card: #1e1517; --text: #f4eeec; --muted: #a8999a; --line: #33272a; --red-ink: #ff5c74;
      --red-soft: #3a161d; --good: #4fd19a; --good-soft: #143026; --warn: #f0c04c; --warn-soft: #362a10;
      --bad: #ff5c74; --bad-soft: #3a161d; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  /* 빠르게 두 번 눌러도 화면이 확대되지 않게 한다 (두 손가락 확대는 그대로 됨) */
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font);
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;  /* 브라우저 기본 새로고침 대신 아래의 '당겨서 새로고침'을 쓴다 */
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- 당겨서 새로고침 ---------- */
  .ptr {
    position: fixed; top: 0; left: 50%; z-index: 30; display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px; background: var(--card); color: var(--text);
    box-shadow: 0 4px 16px rgba(0,0,0,.18); font-size: 13px; font-weight: 700;
    transform: translate(-50%, -60px); opacity: 0; pointer-events: none;
  }
  .ptr svg { width: 18px; height: 18px; fill: none; stroke: var(--red); stroke-width: 2.4; stroke-linecap: round; transition: transform .15s; }
  .ptr.ready svg { transform: rotate(180deg); }
  .ptr.loading svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 부상·결장 ---------- */
  .basis { margin-bottom: 12px; padding: 11px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 13px; color: var(--muted); line-height: 1.6; }
  .basis b { color: var(--text); }
  .ban { margin-top: 6px; font-size: 13.5px; line-height: 1.7; }
  .ban span { display: inline-block; margin-right: 6px; padding: 0 7px; border-radius: 5px; font-size: 11.5px; font-weight: 800; }
  .ban .no { background: var(--bad-soft); color: var(--bad); }
  .ban .ok { background: var(--good-soft); color: var(--good); }
  a { color: inherit; text-decoration: none; }
  [hidden] { display: none !important; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* ---------- 헤더: 레드 그라데이션 + 은은한 줄무늬 ---------- */
  .hero {
    color: #fff; padding: calc(18px + env(safe-area-inset-top)) 0 64px;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 14px, transparent 14px 28px),
      radial-gradient(120% 140% at 85% 0%, #e5193d 0%, var(--red) 45%, var(--red-deep) 100%);
  }
  .hero .brand { display: flex; align-items: center; gap: 12px; }
  /* 엠블럼이 빨간색이라 빨간 배경에 묻히지 않도록 흰 원형 배지 위에 올린다 */
  .badge {
    flex: none; display: grid; place-items: center; border-radius: 50%; background: #fff;
    box-shadow: 0 0 0 3px rgba(246, 235, 97, .9), 0 4px 14px rgba(0,0,0,.25);
  }
  .badge img { object-fit: contain; }
  .hero .badge { width: 54px; height: 54px; }
  .hero .badge img { width: 38px; height: 38px; }
  .hero h1 { margin: 0; font-weight: 800; font-size: 24px; letter-spacing: -.02em; line-height: 1.2; }
  .ynwa { font-weight: 800; letter-spacing: .14em; font-size: 11px; color: var(--yellow); margin-top: 3px; }
  .hero .updated { font-size: 12.5px; opacity: .82; margin-top: 6px; }
  /* 홈이 아닌 탭에서는 헤더를 얇게 줄여 내용이 바로 보이게 한다 */
  .hero.compact { padding: calc(10px + env(safe-area-inset-top)) 0 12px; }
  .hero.compact .badge { width: 36px; height: 36px; box-shadow: 0 0 0 2px rgba(246, 235, 97, .9); }
  .hero.compact .badge img { width: 26px; height: 26px; }
  .hero.compact h1 { font-size: 21px; }
  .hero.compact .ynwa { display: none; }
  .hero.compact .updated { margin-top: 0; font-size: 12px; }
  .hero.compact .brand { gap: 10px; }

  /* ---------- 다음 경기 카드 (헤더 위로 겹쳐 올라옴) ---------- */
  .matchday {
    margin-top: -48px; position: relative; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow);
    background: var(--card); border: 1px solid var(--line);
  }
  .matchday .bar {
    display: flex; justify-content: space-between; align-items: center; padding: 9px 16px;
    background: #1c1516; color: #fff; font-size: 12.5px; font-weight: 600;
  }
  .matchday .bar .md { font-weight: 800; letter-spacing: .12em; font-size: 12px; color: var(--yellow); }
  .matchday .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 18px 12px 6px; text-align: center; }
  .matchday .side img { width: 58px; height: 58px; object-fit: contain; }
  .matchday .side div { font-weight: 700; margin-top: 6px; font-size: 15px; }
  .matchday .side.lfc div { color: var(--red-ink); }
  .matchday .mid { padding: 0 8px; }
  .matchday .kick { font-weight: 800; font-size: 34px; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .matchday .date { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .dday {
    display: inline-block; margin-top: 8px; background: var(--yellow); color: #1c1516; border-radius: 6px;
    padding: 3px 11px; font-weight: 800; font-size: 13px;
  }
  .matchday .venue { text-align: center; font-size: 12.5px; color: var(--muted); padding: 4px 16px 14px; }

  /* ---------- 순위·폼 요약 ---------- */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 13px 15px; box-shadow: var(--shadow); }
  .stat { border-top: 3px solid var(--red); position: relative; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .stat:active { transform: scale(.98); }
  .stat .go { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 26px; font-weight: 300; color: var(--muted); }
  .stat.ucl { border-top-color: var(--teal); }
  .label { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
  .big { font-weight: 800; font-size: 34px; line-height: 1.1; margin-top: 4px; letter-spacing: -.03em; }
  .big small { font-weight: 700; font-size: 16px; margin-left: 2px; letter-spacing: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .form { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .form .sub { white-space: nowrap; }
  .form .dots { display: flex; gap: 6px; }
  .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 800; color: #fff; }
  .dot.W { background: var(--good); } .dot.D { background: #8c8486; } .dot.L { background: var(--red); }

  /* ---------- 컵대회 진척도 ---------- */
  .comp { padding: 14px 16px; border-top: 1px solid var(--line); }
  .comp:first-child { border-top: 0; }
  .comp .top { display: flex; align-items: center; gap: 10px; }
  .comp .top b { flex: 1; font-size: 15.5px; }
  .steps { display: flex; margin: 14px 0 2px; }
  .step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .step::before { content: ""; position: absolute; top: 8px; right: 50%; width: 100%; height: 3px; background: var(--line); z-index: 0; }
  .step:first-child::before { display: none; }
  .step i {
    position: relative; z-index: 1; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center;
    background: var(--card); border: 3px solid var(--line); font-style: normal; font-size: 10px; color: #fff;
  }
  .step.done::before, .step.current::before, .step.won::before, .step.out::before, .step.skip::before { background: var(--red); }
  .step.done i { background: var(--red); border-color: var(--red); }
  .step.done, .step.current, .step.won { color: var(--text); }
  .step.current i { background: var(--yellow); border-color: var(--red); box-shadow: 0 0 0 4px var(--red-soft); }
  .step.current { color: var(--red-ink); }
  .step.won i { background: var(--yellow); border-color: var(--yellow); color: #1c1516; width: 24px; height: 24px; margin-top: -3px; }
  .step.out i { background: #8c8486; border-color: #8c8486; }
  .step.out { color: var(--muted); text-decoration: line-through; }
  .step.skip i { width: 9px; height: 9px; margin: 5px 0; border: 0; background: var(--red); opacity: .45; }
  .opp { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .opp img { width: 18px; height: 18px; object-fit: contain; }
  .opp b { color: var(--text); }
  .opp .when { flex-basis: 100%; margin-top: -3px; }
  .cups { grid-column: 1 / -1; padding: 0; overflow: hidden; }
  .cups .head { padding: 12px 15px 0; }
  .cups .comp { padding: 10px 15px 12px; border-top: 0; }
  .cups .comp + .comp { border-top: 1px solid var(--line); }
  .cups .steps { margin-top: 10px; }

  /* ---------- 하단 메뉴 바 (앱처럼 항상 화면 아래에 떠 있음) ---------- */
  #app { padding-bottom: calc(66px + env(safe-area-inset-bottom)); }
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;
    padding: 2px 4px env(safe-area-inset-bottom); border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .bottom-nav .inner { display: flex; width: 100%; max-width: 760px; }
  .bottom-nav button {
    flex: 1; position: relative; border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit;
    font-size: 11px; font-weight: 700; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .bottom-nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .bottom-nav button[aria-selected="true"] { color: var(--red-ink); }
  .bottom-nav button[aria-selected="true"]:not(.home)::before {
    content: ""; position: absolute; top: -3px; width: 30px; height: 3px; border-radius: 0 0 3px 3px; background: var(--red);
  }
  /* 가운데 홈 버튼: 메뉴 바 위로 솟은 큰 빨간 원 */
  .bottom-nav .home { padding-top: 0; }
  .bottom-nav .home .circle {
    width: 58px; height: 58px; margin-top: -24px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: radial-gradient(120% 120% at 30% 20%, #e5193d 0%, var(--red) 55%, var(--red-deep) 100%);
    box-shadow: 0 0 0 4px var(--card), 0 6px 16px rgba(200, 16, 46, .35);
    transition: box-shadow .15s;
  }
  .bottom-nav .home .circle svg { width: 28px; height: 28px; stroke-width: 2.1; }
  .bottom-nav .home[aria-selected="true"] .circle { box-shadow: 0 0 0 4px var(--card), 0 0 0 7px var(--yellow), 0 6px 16px rgba(200, 16, 46, .35); }

  /* 순위·대회 탭 안의 선택 버튼 */
  .seg { display: flex; gap: 4px; padding: 4px; margin-bottom: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .seg button {
    flex: 1; border: 0; background: none; padding: 9px 0; border-radius: 9px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 800; color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: var(--red); color: #fff; }
  .subpanel > h2:first-child { margin-top: 4px; }
  section.panel { display: none; padding-top: 14px; }
  #panel-home { padding-top: 0; }
  section.panel.active { display: block; }
  h2 { font-weight: 800; font-size: 17px; letter-spacing: -.01em; margin: 22px 0 8px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--red); }
  h2.teal::before { background: var(--teal); }
  section.panel > h2:first-child { margin-top: 4px; }

  /* ---------- 공통 목록 ---------- */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chips button {
    border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 6px 13px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .chips button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .news-item { display: block; padding: 13px 16px; border-top: 1px solid var(--line); }
  .news-item:first-child { border-top: 0; }
  .news-item:hover { background: var(--red-soft); }
  .news-item .ko { font-weight: 700; font-size: 15.5px; line-height: 1.45; }
  .news-item .orig { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .news-item .meta { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 5px; background: var(--red-soft); color: var(--red-ink); }
  .tag.reddit { background: #ffe9dc; color: #c4410f; }
  .tag.journo { background: var(--yellow); color: #1c1516; }

  .row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 0; }
  .pill { flex: none; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
  .tone-good { background: var(--good-soft); color: var(--good); }
  .tone-neutral { background: var(--warn-soft); color: var(--warn); }
  .tone-bad { background: var(--bad-soft); color: var(--bad); }
  .pos {
    flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    font-weight: 800; font-size: 12px; background: var(--red-soft); color: var(--red-ink);
  }

  /* ---------- 경기 ---------- */
  .match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .match:first-child { border-top: 0; }
  .match .head { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .team { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .team.away { flex-direction: row-reverse; text-align: right; }
  .team img { width: 24px; height: 24px; object-fit: contain; flex: none; }
  .team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team.lfc { color: var(--red-ink); font-weight: 800; }
  .score { font-weight: 800; font-size: 20px; line-height: 1; min-width: 70px; text-align: center; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .score.time { font-size: 16px; font-weight: 700; color: var(--muted); }
  .res { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 5px; color: #fff; }
  .res-W { background: var(--good); } .res-D { background: #8c8486; } .res-L { background: var(--red); }
  .match.has-detail, .matchday.has-detail, .dot[data-match] { cursor: pointer; }
  .matchday .rec-link { color: var(--red-ink); font-weight: 800; margin-top: -10px; }
  .matchday .venue + .rec-link { padding-top: 0; }

  /* ---------- 매치 프리뷰 ---------- */
  .pv-info > div { display: flex; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 14px; }
  .pv-info > div:first-child { border-top: 0; }
  .pv-info span { flex: none; width: 52px; color: var(--muted); font-weight: 700; font-size: 13px; }
  .pv-info b { font-weight: 700; }
  .pv-info a { color: var(--red-ink); font-weight: 800; }
  h2 small { font-size: 12px; color: var(--muted); font-weight: 600; }
  .pv-form { padding: 12px 14px; border-top: 1px solid var(--line); }
  .pv-form:first-child { border-top: 0; }
  .pv-form .who { display: flex; align-items: center; gap: 7px; font-size: 14px; margin-bottom: 8px; }
  .pv-form .who img { width: 20px; height: 20px; object-fit: contain; }
  .pv-form .dots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .pv-form .g { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; text-align: center; }
  .pv-form .g small { font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .pv-form .g .opp { font-weight: 500; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-note { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .pv-lead .nums span:first-child, .pv-lead .nums span:last-child { font-size: 13.5px; }
  .pv-lead b { font-weight: 800; color: var(--red-ink); margin-left: 2px; }
  .bn .mk .inj-s, .bn .mk .inj-i, .bn .mk .inj-n { color: var(--bad); font-weight: 700; }
  .bn .mk .inj-d { color: var(--warn); font-weight: 700; }
  .recent { grid-column: 1 / -1; padding: 12px 0 0; overflow: hidden; }
  .recent .label { padding: 0 15px; }
  .recent .list { border: 0; border-radius: 0; box-shadow: none; background: none; }
  .recent .match { padding: 8px 15px 12px; }
  .match.has-detail:active { background: var(--red-soft); }
  .match .rec { margin-left: auto; font-weight: 800; color: var(--red-ink); white-space: nowrap; }
  .match .head .res + .rec { margin-left: 0; }
  .match .head > span:first-child { flex: 1; min-width: 0; }

  /* ---------- 경기 기록 (전체 화면으로 열림) ---------- */
  .sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
  .sheet-top {
    color: #fff; padding: calc(8px + env(safe-area-inset-top)) 0 16px;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 14px, transparent 14px 28px),
      radial-gradient(120% 140% at 85% 0%, #e5193d 0%, var(--red) 45%, var(--red-deep) 100%);
  }
  .sheet-top .bar { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; }
  .sheet-top .bar span { flex: 1; opacity: .9; }
  .sheet-top .close {
    width: 38px; height: 38px; margin-left: -8px; border: 0; border-radius: 50%; background: none; color: #fff; cursor: pointer;
    display: grid; place-items: center;
  }
  .sheet-top .close svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .sheet-top .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; margin-top: 6px; }
  .sheet-top .side img { width: 48px; height: 48px; object-fit: contain; background: #fff; border-radius: 50%; padding: 5px; }
  .sheet-top .side div { font-weight: 700; margin-top: 5px; font-size: 14.5px; }
  .sheet-top .kick { font-weight: 800; font-size: 34px; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; padding: 0 10px; }
  .sheet-top .state { display: inline-block; margin-top: 6px; background: var(--yellow); color: #1c1516; border-radius: 6px; padding: 2px 10px; font-weight: 800; font-size: 12.5px; }
  .sheet .wrap { padding-top: 14px; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
  .sheet .seg { position: sticky; top: 8px; z-index: 2; box-shadow: var(--shadow); }

  /* 주요 장면: 홈 팀은 왼쪽, 원정 팀은 오른쪽, 가운데에 시간 */
  .tl-row { display: grid; grid-template-columns: 1fr 52px 1fr; align-items: center; gap: 6px; padding: 9px 12px; border-top: 1px solid var(--line); }
  .tl-row:first-child { border-top: 0; }
  .tl-row .min { text-align: center; font-size: 12.5px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tl-row.big .min { color: var(--red-ink); }
  .tl-ev { word-break: keep-all; overflow-wrap: anywhere; display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 13.5px; line-height: 1.35; }
  .tl-ev.home { justify-content: flex-end; text-align: right; }
  .tl-ev.home .ico { order: 2; }
  .tl-ev b { font-weight: 700; }
  .tl-row.big .tl-ev b { font-weight: 800; }
  .tl-ev small { display: block; color: var(--muted); font-size: 12px; }
  .tl-ev .in { color: var(--good); }
  .ico { flex: none; width: 22px; text-align: center; font-size: 15px; }
  .card-y, .card-r { display: inline-block; width: 11px; height: 15px; border-radius: 2px; vertical-align: -2px; }
  .card-y { background: #f2c200; } .card-r { background: #e01e1e; }
  .tl-ev.miss b { color: var(--muted); text-decoration: line-through; }
  .tl-ev.miss .ico { color: var(--bad); font-weight: 800; }
  .tl-row .min.pk { color: var(--text); font-size: 13.5px; }
  .tl-ht.pk-head { color: var(--red-ink); font-size: 13px; }
  .tl-ht { padding: 7px 12px; border-top: 1px solid var(--line); text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); background: color-mix(in srgb, var(--line) 45%, transparent); }

  /* 팀 기록: 양쪽 숫자 + 가운데서 만나는 막대 */
  .st-row { padding: 10px 16px 11px; border-top: 1px solid var(--line); }
  .st-row:first-child { border-top: 0; }
  .st-row .nums { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-variant-numeric: tabular-nums; }
  .st-row .nums span:nth-child(2) { font-size: 12.5px; color: var(--muted); font-weight: 700; }
  .st-row .nums .win { font-weight: 800; }
  .st-row .bars { display: flex; gap: 4px; margin-top: 6px; }
  .st-row .bars div { flex: 1; height: 6px; border-radius: 3px; background: var(--line); display: flex; overflow: hidden; }
  .st-row .bars div:first-child { justify-content: flex-end; }
  .st-row .bars i { display: block; height: 100%; border-radius: 3px; background: #8c8486; }
  .st-row .bars i.lfc { background: var(--red); }
  .st-head { display: flex; justify-content: space-between; padding: 10px 16px; font-size: 13px; font-weight: 800; border-bottom: 1px solid var(--line); }

  /* 라인업 */
  /* 포메이션 그림: 경기장 전체 (위쪽 절반 홈 팀, 아래쪽 절반 원정 팀) */
  .pitch {
    position: relative; aspect-ratio: 1 / 2.4; overflow: hidden;
    background: repeating-linear-gradient(180deg, #2f8a4a 0 6.25%, #2a7f44 6.25% 12.5%);
  }
  .pitch::before { content: ""; position: absolute; inset: 8px; border: 2px solid rgba(255,255,255,.35); border-radius: 2px; }
  .pitch .box { position: absolute; left: 22%; right: 22%; height: 7%; border: 2px solid rgba(255,255,255,.35); }
  .pitch .box.top { top: 8px; border-top: 0; }
  .pitch .box.bottom { bottom: 8px; border-bottom: 0; }
  .pitch .half { position: absolute; left: 8px; right: 8px; top: 50%; border-top: 2px solid rgba(255,255,255,.35); }
  .pitch .circle { position: absolute; left: 50%; top: 50%; width: 28%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.35); border-radius: 50%; }
  .pl { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: 1; }
  .pl .shirt {
    position: relative; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center;
    background: #1f2a44; color: #fff; border: 2.5px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .pl.lfc .shirt { background: var(--red); }
  .pl.gk .shirt { background: var(--yellow); color: #1c1516; }
  .pl.lfc.gk .shirt { background: var(--teal); color: #fff; }
  /* 사진은 배경이 투명한 상반신 사진이라, 크게 키워 머리·어깨만 동그라미 안에 보이게 자른다 */
  .pl .face { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
  .pl .shirt.has-photo { background: radial-gradient(circle at 50% 30%, #fff 0%, #e4dcda 100%); border-color: #1f2a44; }
  .pl.lfc .shirt.has-photo { background: radial-gradient(circle at 50% 30%, #fff 0%, #f6d9de 100%); border-color: var(--red); }
  .pl.gk .shirt.has-photo { border-color: var(--yellow); }
  .pl.lfc.gk .shirt.has-photo { border-color: var(--teal); }
  .pl .shirt img { position: absolute; left: -20%; top: 2%; width: 140%; height: auto; }
  .pl .num { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
  /* 사진이 있으면 등번호는 왼쪽 아래 작은 딱지로 */
  .pl .has-photo .num {
    position: absolute; left: -5px; bottom: -3px; z-index: 1; min-width: 17px; height: 17px; padding: 0 3px; border-radius: 9px;
    display: grid; place-items: center; font-size: 10px; background: #1f2a44; color: #fff; border: 1.5px solid #fff;
  }
  .pl.lfc .has-photo .num { background: var(--red); }
  .pl .badges { position: absolute; top: -4px; right: -10px; z-index: 1; display: flex; gap: 1px; font-size: 11px; line-height: 1; }
  .pl .badges .card-y, .pl .badges .card-r { width: 8px; height: 11px; }
  .pl .pn {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: #fff; font-size: 11.5px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .pl .po { margin-top: -2px; font-size: 10.5px; font-weight: 800; color: #ffd0d6; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .pitch + .lu-head { border-bottom: 0; border-top: 1px solid var(--line); }
  /* 교체 명단 두 칸 */
  .bench-head, .bench-cols { display: grid; grid-template-columns: 1fr 1fr; }
  .bench-head span { display: flex; align-items: center; gap: 6px; padding: 10px 12px; font-size: 13px; font-weight: 800; border-bottom: 1px solid var(--line); min-width: 0; white-space: nowrap; overflow: hidden; }
  .bench-head img { width: 18px; height: 18px; object-fit: contain; flex: none; }
  .bench-cols > div + div, .bench-head span + span { border-left: 1px solid var(--line); }
  .bn { display: grid; grid-template-columns: 22px 1fr; align-items: center; column-gap: 6px; padding: 7px 10px; border-top: 1px solid var(--line); font-size: 13.5px; }
  .bn:first-child { border-top: 0; }
  .bn .no { text-align: center; font-weight: 800; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bn .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .bn .mk { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bn .mk .in { color: var(--good); }
  .bn.unused { color: var(--muted); }
  .bn.unused .nm { font-weight: 400; }
  .lu-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 800; }
  .lu-head img { width: 22px; height: 22px; object-fit: contain; }
  .lu-head .who { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
  .lu-head .who small { font-size: 12px; font-weight: 600; color: var(--muted); }
  .lu-head span { margin-left: auto; font-size: 13px; color: var(--muted); }
  .lu { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 8px; padding: 7px 16px; border-top: 1px solid var(--line); font-size: 14px; }
  .lu-head + .lu { border-top: 0; }
  .lu .no { text-align: center; font-weight: 800; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lu .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lu .nm em { font-style: normal; font-size: 11.5px; color: var(--muted); margin-left: 6px; }
  .lu .mk { display: flex; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .lu .mk .in { color: var(--good); font-weight: 700; } .lu .mk .off { color: var(--bad); font-weight: 700; }
  .lu.unused { color: var(--muted); }
  .lu-sub { padding: 8px 16px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 800; color: var(--muted); background: color-mix(in srgb, var(--line) 45%, transparent); }
  .ext { display: block; margin-top: 14px; text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); text-decoration: underline; }

  /* ---------- 순위표 ---------- */
  /* 칸이 많아 좁은 화면에서는 옆으로 밀어 볼 수 있게 하고, 순위·팀 칸은 왼쪽에 고정한다 */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 3px; text-align: center; border-top: 1px solid var(--line); white-space: nowrap; min-width: 24px; }
  th { font-size: 11.5px; color: var(--muted); font-weight: 700; border-top: 0; }
  th.rank, td.rank { position: sticky; left: 0; z-index: 1; background: var(--card); width: 30px; min-width: 30px; font-weight: 800; }
  th.tname, td.tname { position: sticky; left: 30px; z-index: 1; background: var(--card); text-align: left; min-width: 88px; max-width: 120px; }
  td.tname div { display: flex; align-items: center; gap: 6px; }
  td.tname span { overflow: hidden; text-overflow: ellipsis; }
  td.tname img { width: 19px; height: 19px; object-fit: contain; flex: none; }
  .gsep { border-left: 1px dashed var(--line); }
  td.pts { font-weight: 800; font-size: 15px; padding-right: 8px; }
  tr.me td { background: var(--red); color: #fff; font-weight: 800; }
  tr.me td.tname img { background: #fff; border-radius: 50%; padding: 2px; }
  tr.me td.rank { box-shadow: inset 4px 0 0 var(--yellow) !important; }
  tr.z-good td.rank { box-shadow: inset 3px 0 0 var(--good); }
  tr.z-neutral td.rank { box-shadow: inset 3px 0 0 var(--warn); }
  tr.z-bad td.rank { box-shadow: inset 3px 0 0 #8c8486; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 8px 2px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .empty { padding: 22px 16px; color: var(--muted); text-align: center; }
  .notice { margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  .notice.err { color: var(--bad); }
  .more { display: block; width: 100%; padding: 13px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--red-ink); font: inherit; font-weight: 800; cursor: pointer; }

  /* ---------- 맨 아래: 안필드 터널 표지판 ---------- */
  footer { text-align: center; padding: 40px 0 calc(32px + env(safe-area-inset-bottom)); }
  .anfield {
    display: inline-block; background: var(--red); color: #fff; border: 3px solid #fff; outline: 3px solid var(--red);
    padding: 10px 22px; border-radius: 4px; font-weight: 900; font-size: 20px; letter-spacing: .14em; line-height: 1;
  }
  .forget { display: block; margin: 18px auto 0; background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; }

  /* ---------- 접속 코드 화면 ---------- */
  .lock {
    position: fixed; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 24px calc(24px + env(safe-area-inset-bottom)); color: #fff; text-align: center;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 14px, transparent 14px 28px),
      radial-gradient(120% 100% at 50% 0%, #e5193d 0%, var(--red) 45%, var(--red-deep) 100%);
  }
  .lock .badge { width: 112px; height: 112px; }
  .lock .badge img { width: 78px; height: 78px; }
  .lock h2 { justify-content: center; font-size: 26px; margin: 16px 0 0; }
  .lock h2::before { display: none; }
  .lock .ynwa { font-size: 16px; margin-top: 4px; }
  .lock p { opacity: .85; font-size: 14px; margin: 22px 0 12px; }
  .lock .box { width: 100%; max-width: 320px; }
  .lock input {
    width: 100%; padding: 14px; font: inherit; font-size: 16px; border-radius: 12px; border: 0; text-align: center;
    background: #fff; color: #1c1516;
  }
  .lock button {
    width: 100%; margin-top: 10px; padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--yellow); color: #1c1516; font: inherit; font-weight: 800; font-size: 16px; letter-spacing: .08em;
  }
  .lock button:disabled { opacity: .6; }
  .lock .msg { min-height: 22px; margin-top: 10px; font-size: 14px; color: var(--yellow); font-weight: 700; }
</style>
</head>
<body>
<form class="lock" id="lock" hidden>
  <div class="badge"><img src="https://a.espncdn.com/i/teamlogos/soccer/500/364.png" alt=""></div>
  <h2>리버풀 소식</h2>
  <div class="ynwa">YOU'LL NEVER WALK ALONE</div>
  <p>접속 코드를 입력하세요. 이 기기에서는 한 번만 입력하면 돼요.</p>
  <div class="box">
    <input id="code" type="password" autocomplete="current-password" placeholder="접속 코드" required>
    <button type="submit" id="unlock">ENTER ANFIELD</button>
    <div class="msg" id="lock-msg"></div>
  </div>
</form>

<div class="ptr" id="ptr"><svg viewBox="0 0 24 24"><path d="M12 4v14M6 12l6 6 6-6"/></svg><span>당겨서 새로고침</span></div>

<div id="app" hidden>
  <header class="hero" id="hero">
    <div class="wrap">
      <div class="brand">
        <div class="badge"><img src="https://a.espncdn.com/i/teamlogos/soccer/500/364.png" alt=""></div>
        <div>
          <h1 id="page-title">리버풀 소식</h1>
          <div class="ynwa">YOU'LL NEVER WALK ALONE</div>
          <div class="updated" id="updated"></div>
        </div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <section class="panel" id="panel-home"></section>
    <section class="panel" id="panel-news">
      <div class="seg">
        <button data-sub="news">뉴스</button>
        <button data-sub="transfer">이적 루머</button>
        <button data-sub="cafe">카페</button>
      </div>
      <div class="subpanel" id="sub-news"></div>
      <div class="subpanel" id="sub-transfer"></div>
      <div class="subpanel" id="sub-cafe"></div>
    </section>
    <section class="panel" id="panel-injuries"></section>
    <section class="panel" id="panel-matches"></section>
    <section class="panel" id="panel-comps">
      <div class="seg">
        <button data-sub="tables">순위</button>
        <button data-sub="comps">대회 현황</button>
      </div>
      <div class="subpanel" id="sub-tables"></div>
      <div class="subpanel" id="sub-comps"></div>
    </section>

    <footer>
      <div class="anfield">THIS IS ANFIELD</div>
      <button class="forget" id="forget" hidden>이 기기에서 접속 코드 지우기</button>
    </footer>
  </div>

  <nav class="bottom-nav" role="tablist" id="tabs"><div class="inner">
    <button role="tab" data-tab="news" data-title="뉴스">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>뉴스</button>
    <button role="tab" data-tab="injuries" data-title="부상·결장">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>부상</button>

      <span class="circle"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>홈</button>
    <button role="tab" data-tab="matches" data-title="일정·결과">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>일정</button>
    <button role="tab" data-tab="comps" data-title="순위·대회">
      <svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M10 17h4v4h-4z"/></svg>대회</button>
  </div></nav>

  <div class="sheet" id="sheet" hidden></div>
</div>

<script>
const RAW = /*__DATA__*/null;
let DATA = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const kstParts = (iso) => {
  const p = {};
  new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date(iso)).forEach((x) => (p[x.type] = x.value));
  return p;
};
const fmtDate = (iso) => { const p = kstParts(iso); return `${p.month}월 ${p.day}일 (${p.weekday}) ${p.hour}:${p.minute}`; };
const fmtDay = (iso) => { const p = kstParts(iso); return `${p.month}/${p.day} (${p.weekday})`; };
const fmtLongDay = (iso) => { const p = kstParts(iso); return `${p.month}월 ${p.day}일 (${p.weekday})`; };
const fmtTime = (iso) => { const p = kstParts(iso); return `${p.hour}:${p.minute}`; };
const ago = (iso) => {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  if (m < 60 * 24) return `${Math.floor(m / 60)}시간 전`;
  return `${Math.floor(m / 1440)}일 전`;
};
const dday = (iso) => {
  const day = (d) => new Date(new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(d));
  const n = Math.round((day(new Date(iso)) - day(new Date())) / 86400000);
  return n === 0 ? "D-DAY" : n > 0 ? `D-${n}` : `D+${-n}`;
};
const img = (src) => (src ? `<img src="${esc(src)}" alt="" loading="lazy">` : "");
const isLfc = (name) => name === "리버풀";
const RES_KO = { W: "승", D: "무", L: "패" };

/* ---------- 상단 요약: 다음 경기 · 순위 · 최근 폼 ---------- */
function renderSummary() {
  const next = DATA.matches.find((m) => m.state !== "post");
  const pl = DATA.standings.pl.find((r) => r.me);
  const ucl = DATA.standings.ucl.find((r) => r.me);
  const form = DATA.matches.filter((m) => m.result).slice(-5);
  let html = "";
  if (next) {
    const live = next.state === "in";
    const rec = canOpen(next);
    const recText = live ? "경기 기록 보기 ›" : hasLineup(next) ? "라인업 발표! 프리뷰·라인업 보기 ›" : "매치 프리뷰 보기 ›";
    html += `<div class="matchday ${rec ? "has-detail" : ""}" ${rec ? `data-match="${esc(next.id)}"` : ""}>
      <div class="bar"><span class="md">${live ? "LIVE" : "NEXT MATCH"}</span><span>${esc(next.comp)}</span></div>
      <div class="vs">
        <div class="side ${isLfc(next.home) ? "lfc" : ""}">${img(next.home_logo)}<div>${esc(next.home)}</div></div>
        <div class="mid">
          <div class="kick">${live ? `${esc(next.home_score)} - ${esc(next.away_score)}` : fmtTime(next.date)}</div>
          <div class="date">${fmtLongDay(next.date)}</div>

function eventsHtml(d, m) {

    return `<div class="tl-row">${k.side === "home" ? ev : "<div></div>"}<div class="min pk">${esc(k.score)}</div>${k.side === "away" ? ev : "<div></div>"}</div>`;

function statsHtml(d, m) {

      <div class="bars"><div><i class="${lfcHome ? "lfc" : ""}" style="width:${hp}%"></i></div><div><i class="${lfcHome ? "" : "lfc"}" style="width:${ap}%"></i></div></div>

/* 선발 라인업을 한 경기장 그림에 포메이션대로 놓는다: 홈 팀은 위쪽 절반(아래로 공격), 원정 팀은 아래쪽 절반(위로 공격).
   ESPN 포지션 이름으로 앞뒤·좌우 순서를 정하고, 포메이션 숫자(예: 4-2-3-1)대로 줄을 나눈다. */
const POS_DEPTH = { G: 0, CD: 1, LB: 1, RB: 1, LWB: 1.5, RWB: 1.5, DM: 2, CM: 3, LM: 3, RM: 3, AM: 4, LW: 5, RW: 5, F: 5, CF: 5, LF: 5, RF: 5 };
const posDepth = (pos) => POS_DEPTH[String(pos).split("-")[0]] ?? 3;
const posSide = (pos) => {
  const p = String(pos);
  if (p.endsWith("-L")) return -1;
  if (p.endsWith("-R")) return 1;
  if (/^L/.test(p)) return -2;
  if (/^R/.test(p)) return 2;
  return 0;
};
const PHOTO = (code) => `https://resources.premierleague.com/premierleague25/photos/players/110x140/${code}.png`;
function formationLines(l) {
  const counts = String(l.formation || "").split("-").map(Number);
  const gk = l.starters.find((p) => p.pos === "G");
  const field = l.starters.filter((p) => p !== gk);
  if (!gk || !counts.length || counts.some(isNaN) || counts.reduce((a, b) => a + b, 0) !== field.length) return null;
  const sorted = [...field].sort((a, b) => posDepth(a.pos) - posDepth(b.pos));
  const lines = [[gk]];
  let i = 0;
  for (const n of counts) {
    lines.push(sorted.slice(i, i + n).sort((a, b) => posSide(a.pos) - posSide(b.pos)));
    i += n;
  }
  return lines;
}
function playerDot(p, x, y, width, cls) {
  const kinds = p.marks.map((mk) => mk.split("|")[0]);
  const off = p.marks.find((mk) => mk.startsWith("off|"));
  const badges = [
    ...kinds.filter((k) => ["goal", "pen", "og"].includes(k)).map(() => "⚽"),
    kinds.includes("red") ? `<i class="card-r"></i>` : kinds.includes("yellow") ? `<i class="card-y"></i>` : "",
  ].join("");
  // 사진을 못 불러오면 사진만 지우고 등번호 동그라미로 보여준다
  const photo = p.pc ? `<span class="face"><img src="${PHOTO(esc(p.pc))}" alt="" loading="lazy" onerror="this.closest('.shirt').classList.remove('has-photo');this.parentNode.remove()"></span>` : "";
  return `<div class="pl ${cls}" style="left:${x}%;top:${y}%;width:${width}%">
    <span class="shirt ${photo ? "has-photo" : ""}">${photo}<b class="num">${esc(p.no ?? "")}</b>${badges ? `<span class="badges">${badges}</span>` : ""}</span>
    <span class="pn">${esc(p.last || p.name)}</span>
    ${off ? `<span class="po">▼ ${esc(off.split("|")[1])}</span>` : ""}
  </div>`;
}
// 팀 이름 줄: 엠블럼 · 팀 · 감독 · 포메이션
function teamBar(d, m, side) {
  const l = d.lineups[side];
  return `<div class="lu-head">${img(side === "home" ? m.home_logo : m.away_logo)}<div class="who">${esc(side === "home" ? m.home : m.away)}
    ${l.coach ? `<small>감독 ${esc(l.coach)}</small>` : ""}</div><span>${esc(l.formation || "")}</span></div>`;
}
function pitchHtml(d, m) {
  const home = formationLines(d.lineups.home), away = formationLines(d.lineups.away);
  if (!home || !away) return "";
  const half = (lines, top, lfc) => lines.map((line, row) => {
    // 골키퍼는 자기 골대 쪽 끝(5.5% / 94.5%), 마지막 공격 줄은 하프라인 가까이(45% / 55%)
    const step = (row * 39.5) / (lines.length - 1);
    const y = top ? 5.5 + step : 94.5 - step;
    return line.map((p, k) => {
      let x = ((k + 1) * 100) / (line.length + 1);
      if (top) x = 100 - x;  // 위쪽 팀은 아래를 보고 서 있으므로 왼쪽·오른쪽이 뒤집힌다
      const width = Math.min(40, 100 / (line.length + 1) - 0.5);  // 한 줄에 선수가 적을수록 이름 칸을 넓게 (옆 선수와 겹치지 않게)
      return playerDot(p, x, y, width, `${lfc ? "lfc" : ""} ${row === 0 ? "gk" : ""}`);
    }).join("");
  }).join("");
  const bar = (side) => teamBar(d, m, side);
  return `${bar("home")}<div class="pitch"><div class="box top"></div><div class="box bottom"></div><div class="half"></div><div class="circle"></div>
    ${half(home, true, isLfc(m.home))}${half(away, false, isLfc(m.away))}</div>${bar("away")}`;
}
function lineupHtml(d, m) {
  if (!d.lineups) return `<div class="list"><div class="empty">아직 라인업이 나오지 않았어요.</div></div>`;
  const player = (p, unused) => `<div class="lu ${unused ? "unused" : ""}"><span class="no">${esc(p.no ?? "")}</span>
    <span class="nm">${esc(p.name)}${p.pos && p.pos !== "SUB" ? `<em>${esc(p.pos)}</em>` : ""}</span>
    <span class="mk">${p.marks.map(markHtml).join("")}</span></div>`;
  const pitch = pitchHtml(d, m);
  if (!pitch) {
    // 포메이션을 그릴 수 없으면 팀별 명단으로 보여준다
    const team = (side) => {
      const l = d.lineups[side];
      return `<div class="list" style="margin-bottom:12px">
        ${teamBar(d, m, side)}
        ${l.starters.map((p) => player(p)).join("")}
        ${l.bench.length ? `<div class="lu-sub">교체 명단</div>${l.bench.map((p) => player(p, !p.on)).join("")}` : ""}
      </div>`;
    };
    return team("home") + team("away");
  }
  // 교체 명단: 왼쪽 홈 팀, 오른쪽 원정 팀
  const benchCol = (side) => d.lineups[side].bench.map((p) => `<div class="bn ${p.on ? "" : "unused"}">
      <span class="no">${esc(p.no ?? "")}</span><span class="nm">${esc(p.last || p.name)}</span>
      ${p.marks.length ? `<span class="mk">${p.marks.map(markHtml).join("")}</span>` : ""}
    </div>`).join("");
  return `<div class="list">${pitch}</div>
    <h2>교체 명단</h2>
    <div class="list bench">
      <div class="bench-head"><span>${img(m.home_logo)}${esc(m.home)}</span><span>${img(m.away_logo)}${esc(m.away)}</span></div>
      <div class="bench-cols"><div>${benchCol("home")}</div><div>${benchCol("away")}</div></div>
    </div>`;
}
/* ---------- 다음 경기 프리뷰 (킥오프 전) ---------- */
const hasPreview = (m) => !!(DATA.preview && DATA.preview.id === m.id);
const canOpen = (m) => hasDetail(m) || (m.state === "pre" && hasPreview(m));
const hasLineup = (m) => !!(hasDetail(m) && DATA.details[m.id].lineups);
function previewHtml(d, m) {
  const pv = hasPreview(m) ? DATA.preview : null;
  const side = (s) => (s === "home" ? { name: m.home, logo: m.home_logo } : { name: m.away, logo: m.away_logo });
  let html = `<div class="list pv-info">
      <div><span>킥오프</span><b>${fmtDate(m.date)}</b></div>
      ${m.venue ? `<div><span>경기장</span><b>${esc(m.venue)}</b></div>` : ""}
      <div><span>라인업</span><b>${d.lineups ? `<a href="#" data-st-go="lineup">발표됨 · 라인업 보기 ›</a>` : "킥오프 1시간 15분 전쯤 발표되면 바로 올라와요"}</b></div>
    </div>`;

  // 순위 비교: 이 경기 대회의 순위표에서 두 팀을 찾는다 (컵대회면 프리미어리그 순위표)
  const table = m.comp_slug === "uefa.champions" ? DATA.standings.ucl : DATA.standings.pl;
  const row = (name) => table.find((r) => r.team === name);
  const h = row(m.home), a = row(m.away);
  if (h && a) {
    const line = (label, hv, av, lowWins) => {
      const hn = parseFloat(hv), an = parseFloat(av);
      const hw = lowWins ? hn < an : hn > an, aw = lowWins ? an < hn : an > hn;
      return `<div class="st-row"><div class="nums"><span class="${hw ? "win" : ""}">${esc(hv)}</span><span>${label}</span><span class="${aw ? "win" : ""}">${esc(av)}</span></div></div>`;
    };
    html += `<h2>${m.comp_slug === "uefa.champions" ? "챔피언스리그" : "프리미어리그"} 순위</h2>
      <div class="list"><div class="st-head"><span>${esc(m.home)}</span><span>${esc(m.away)}</span></div>
      ${line("순위", h.rank + "위", a.rank + "위", true)}${line("승점", h.pts, a.pts)}${line("경기", h.p, a.p)}
      ${line("승-무-패", `${h.w}-${h.d}-${h.l}`, `${a.w}-${a.d}-${a.l}`)}${line("득실", h.gd, a.gd)}</div>`;
  }

  if (pv && (pv.form.home || pv.form.away)) {
    const formRow = (s) => {
      const list = pv.form[s] || [];
      return `<div class="pv-form"><div class="who">${img(side(s).logo)}<b>${esc(side(s).name)}</b></div>
        <div class="dots">${list.map((g) => `<div class="g"><span class="dot ${esc(g.res)}">${RES_KO[g.res] || "-"}</span>
          <small>${esc(g.score)}</small><small class="opp">${esc(g.opp)}</small></div>`).join("")}</div></div>`;
    };
    html += `<h2>최근 5경기</h2><div class="list">${formRow("home")}${formRow("away")}
      <div class="pv-note">왼쪽이 오래된 경기, 오른쪽이 최근 경기 · 점수는 그 팀 기준</div></div>`;
  }

  if (pv && pv.h2h.length) {
    html += `<h2>최근 맞대결</h2><div class="list">${pv.h2h.map((g) => matchRow({ ...g, state: "post", result: null })).join("")}</div>`;
  }

  if (pv && pv.leaders.length) {
    const cell = (x) => (x ? `${esc(x.name)} <b>${esc(x.value)}</b>` : "-");
    html += `<h2>팀별 주요 선수 <small>이번 시즌</small></h2><div class="list">
      <div class="st-head"><span>${esc(m.home)}</span><span>${esc(m.away)}</span></div>
      ${pv.leaders.map((r) => `<div class="st-row pv-lead"><div class="nums"><span>${cell(r.home)}</span><span>${esc(r.label)}</span><span>${cell(r.away)}</span></div></div>`).join("")}</div>`;
  }

  // 부상·결장: 리버풀은 부상 탭과 같은 목록, 상대 팀은 FPL(프리미어리그 팀일 때만)
  if (pv) {
    const lfcSide = pv.opp_side === "home" ? "away" : "home";
    const list = (s) => {
      const items = s === lfcSide ? DATA.injuries : pv.opp_injuries;
      if (!items) return `<div class="bn unused"><span></span><span class="nm">정보 없음</span></div>`;
      if (!items.length) return `<div class="bn unused"><span></span><span class="nm">없음</span></div>`;
      return items.map((p) => `<div class="bn"><span class="no">${esc(p.pos)}</span><span class="nm">${esc(p.name)}</span>
        <span class="mk"><span class="inj-${esc(p.status)}">${esc(p.status_ko)}${p.chance != null && p.status === "d" ? ` ${esc(p.chance)}%` : ""}</span></span></div>`).join("");
    };
    html += `<h2>부상·결장</h2><div class="list bench">
      <div class="bench-head"><span>${img(m.home_logo)}${esc(m.home)}</span><span>${img(m.away_logo)}${esc(m.away)}</span></div>
      <div class="bench-cols"><div>${list("home")}</div><div>${list("away")}</div></div></div>
      <div class="notice">부상·결장은 프리미어리그 공식 판타지(FPL) 기준이라 프리미어리그 팀만 나와요.</div>`;
  }
  return html;
}

  const tabs = pre ? [["preview", "프리뷰"], ["lineup", d.lineups ? "라인업 ●" : "라인업"]]

  if (!tabs.some(([k]) => k === sheetTab)) sheetTab = tabs[0][0];

  el.innerHTML = `<div class="sheet-top"><div class="wrap">
      <div class="bar"><button class="close" id="sheet-close" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span>${esc(m.comp)} · ${fmtLongDay(m.date)}</span></div>
      <div class="vs">
        <div class="side">${img(m.home_logo)}<div>${esc(m.home)}</div></div>
        <div><div class="kick">${pre ? fmtTime(m.date) : `${esc(m.home_score ?? "")} - ${esc(m.away_score ?? "")}`}</div><span class="state">${esc(state)}</span></div>
        <div class="side">${img(m.away_logo)}<div>${esc(m.away)}</div></div>

    </div></div>
    <div class="wrap">
      <div class="seg">${tabs.map(([k, label]) => `<button data-st="${k}" aria-pressed="${k === sheetTab}">${label}</button>`).join("")}</div>
      ${body}
      <div class="notice">${live ? "경기 중에는 10분마다 새로 고쳐요. " : pre ? "킥오프 전 정보예요. 경기가 시작되면 이 화면이 경기 기록으로 바뀌어요. " : ""}기준: ${ago(d.fetched)} · 출처: ESPN</div>
      <a class="ext" href="https://www.espn.com/soccer/match/_/gameId/${esc(m.id)}" target="_blank" rel="noopener noreferrer">ESPN에서 더 자세히 보기</a>
    </div>`;
  el.querySelector("#sheet-close").addEventListener("click", () => history.back());
  el.querySelectorAll("[data-st], [data-st-go]").forEach((b) => b.addEventListener("click", (e) => {
    e.preventDefault();
    sheetTab = b.dataset.st || b.dataset.stGo;
    renderSheet(id);
  }));
}
function openMatch(id) {
  const m = DATA.matches.find((x) => x.id === id);
  if (!m || !canOpen(m)) return;
  sheetTab = m.state === "pre" ? "preview" : "events";

function closeMatch() {
  document.getElementById("sheet").hidden = true;
  document.body.style.overflow = "";

/* ---------- 순위 ---------- */

    <tbody>${rows.map((r) => `<tr class="${r.me ? "me" : ""} ${zoneOf ? "z-" + zoneOf(r.rank) : ""}">
      <td class="rank">${r.rank}</td><td class="tname" title="${esc(r.team)}"><div>${img(r.logo)}<span>${esc(r.short || r.team)}</span></div></td>
      <td>${esc(r.p)}</td><td>${esc(r.w)}</td><td>${esc(r.d)}</td><td>${esc(r.l)}</td>

    </tr>`).join("")}</tbody></table></div>`;
}
function renderTables() {
  const el = document.getElementById("sub-tables");
  const plZone = (r) => (r <= 4 ? "good" : r >= 18 ? "bad" : "");
  const uclZone = (r) => (r <= 8 ? "good" : r <= 24 ? "neutral" : "bad");
  el.innerHTML = `<h2 id="table-pl">프리미어리그</h2>${tableHtml(DATA.standings.pl, plZone)}
    <div class="legend"><span><i style="background:var(--good)"></i>챔스 진출권(1~4위)</span><span><i style="background:#8c8486"></i>강등권</span></div>
    <h2 class="teal" id="table-ucl">챔피언스리그 리그 페이즈</h2>${tableHtml(DATA.standings.ucl, uclZone)}
    <div class="legend"><span><i style="background:var(--good)"></i>16강 직행 (1~8위)</span><span><i style="background:var(--warn)"></i>플레이오프 (9~24위)</span><span><i style="background:#8c8486"></i>탈락 (25~36위)</span></div>`;

/* ---------- 대회 현황 ---------- */
function stepsHtml(steps) {
  const mark = { done: "", current: "", won: "🏆", out: "✕", skip: "", todo: "" };
  return `<div class="steps">${steps.map((s) => `<div class="step ${s.state}"><i>${mark[s.state]}</i>${esc(s.label)}</div>`).join("")}</div>`;
}
function oppHtml(n) {
  if (!n) return "";
  const where = n.home ? "홈" : "원정";
  const round = [n.round, n.leg].filter(Boolean).join(" ");
  return `<div class="opp"><span>다음 상대</span>${img(n.opp_logo)}<b>${esc(n.opp)}</b><span>(${where})</span>
    <span class="when">${round ? esc(round) + " · " : ""}${fmtDate(n.date)}</span></div>`;

function compHtml(c, compact) {

    <div class="top"><b>${esc(c.name)}</b>${c.status ? `<span class="pill tone-${c.tone}">${esc(c.status)}</span>` : ""}</div>
    ${!compact && c.detail ? `<div class="sub">${esc(c.detail)}</div>` : ""}
    ${c.steps ? stepsHtml(c.steps) : ""}
    ${oppHtml(c.next)}

function renderComps() {
  const el = document.getElementById("sub-comps");
  let html = `<div class="list">${DATA.competitions.map((c) => compHtml(c, false)).join("")}</div>`;
  if (DATA.errors.length) html += `<div class="notice err">이번에 불러오지 못한 정보: ${DATA.errors.map(esc).join(", ")}</div>`;
  el.innerHTML = html;
}

/* ---------- 탭 ---------- */
function showTab(name) {
  let title = "리버풀 소식";
  document.querySelectorAll("#tabs button").forEach((b) => {
    b.setAttribute("aria-selected", String(b.dataset.tab === name));
    if (b.dataset.tab === name) title = b.dataset.title;
  });
  document.querySelectorAll("section.panel").forEach((s) => s.classList.toggle("active", s.id === "panel-" + name));
  document.getElementById("hero").classList.toggle("compact", name !== "home");
  document.getElementById("page-title").textContent = title;
}
function goTab(name) {
  showTab(name);
  window.scrollTo(0, 0);
}
/* 홈의 순위 카드를 누르면: 대회 탭 → 순위 → 그 대회 순위표 위치로 */
function goTable(which) {
  goTab("comps");
  showSub(document.getElementById("panel-comps"), "tables");
  const h = document.getElementById("table-" + which);
  if (!h || which === "pl") return;  // 프리미어리그 표는 맨 위에 있으니 그대로 둔다
  window.scrollTo({ top: h.getBoundingClientRect().top + window.scrollY - 12, behavior: "smooth" });

document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => goTab(b.dataset.tab)));

/* 순위·대회 탭 안에서 순위 / 대회 현황 고르기 (마지막 선택을 기억) */
function showSub(panel, name) {
  panel.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sub === name)));
  panel.querySelectorAll(".subpanel").forEach((s) => (s.hidden = s.id !== "sub-" + name));
  store.set("sub-" + panel.id, name);
}
function restoreSub(panel) {
  const subs = [...panel.querySelectorAll(".seg button")].map((b) => b.dataset.sub);
  const saved = store.get("sub-" + panel.id);
  showSub(panel, subs.includes(saved) ? saved : subs[0]);
}
document.querySelectorAll(".seg").forEach((seg) => seg.querySelectorAll("button").forEach((b) =>
  b.addEventListener("click", () => showSub(seg.closest("section"), b.dataset.sub))));

function start(data) {
  DATA = data;
  document.getElementById("lock").hidden = true;
  document.getElementById("app").hidden = false;
  renderSummary(); renderNews(); renderInjuries(); renderMatches(); renderTables(); renderComps();
  document.querySelectorAll(".seg").forEach((seg) => restoreSub(seg.closest("section")));
  showTab("home");  // 열 때는 항상 홈에서 시작
}

/* ---------- 접속 코드 (build.py 의 encrypt 와 같은 방식으로 푼다) ---------- */
async function unlock(code) {
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: bytes(RAW.salt), iterations: RAW.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(RAW.iv) }, key, bytes(RAW.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function boot() {
  if (!RAW.locked) { start(RAW); return; }
  document.getElementById("forget").hidden = false;
  const saved = store.get("code");
  if (saved) {
    try { start(await unlock(saved)); return; } catch (e) { store.set("code", ""); }
  }
  const form = document.getElementById("lock");
  const input = document.getElementById("code");
  const btn = document.getElementById("unlock");
  const msg = document.getElementById("lock-msg");
  form.hidden = false;
  input.focus();
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const code = input.value.trim();
    btn.disabled = true; msg.textContent = "";
    try {
      const data = await unlock(code);
      store.set("code", code);
      start(data);
    } catch (e) {
      msg.textContent = "코드가 맞지 않아요.";
      btn.disabled = false; input.select();
    }
  });
}
document.getElementById("forget").addEventListener("click", () => {
  store.set("code", "");
  location.reload();
});
/* ---------- 당겨서 새로고침 ----------
   홈 화면에 추가한 앱 모드에서는 휴대폰 기본 '당겨서 새로고침'이 없어서 직접 만든다.
   맨 위에서 아래로 당긴 뒤 충분히 내려오면 "놓으면 새로고침" → 손을 떼면 새로고침. */
(function pullToRefresh() {
  const el = document.getElementById("ptr");
  const label = el.querySelector("span");
  const MAX = 100, READY = 60;
  let startY = null, pull = 0;
  const show = (y, text, cls) => {
    el.style.transform = `translate(-50%, ${y}px)`;
    el.style.opacity = String(Math.min(1, (y + 50) / 60));
    el.className = "ptr " + (cls || "");
    label.textContent = text;
  };
  const reset = () => {
    startY = null; pull = 0;
    el.style.transition = "transform .2s, opacity .2s";
    show(-60, "당겨서 새로고침");
    setTimeout(() => (el.style.transition = ""), 200);
  };
  addEventListener("touchstart", (e) => {
    const appOpen = !document.getElementById("app").hidden && document.getElementById("sheet").hidden;
    startY = appOpen && window.scrollY <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null;
  }, { passive: true });
  addEventListener("touchmove", (e) => {
    if (startY === null) return;
    const dist = e.touches[0].clientY - startY;
    if (dist <= 0 || window.scrollY > 0) { if (pull) reset(); else startY = null; return; }
    pull = Math.min(dist * 0.5, MAX);
    show(pull - 50, pull >= READY ? "놓으면 새로고침" : "당겨서 새로고침", pull >= READY ? "ready" : "");
  }, { passive: true });
  addEventListener("touchend", () => {
    if (startY === null) return;
    if (pull >= READY) {
      show(16, "새로고침 중…", "loading");
      location.reload();
    } else {
      reset();
    }
  });
})();

boot();
