<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-title" content="리버풀 소식">
<title>리버풀 소식</title>
<link rel="icon" href="https://a.espncdn.com/i/teamlogos/soccer/500/364.png">
<link rel="apple-touch-icon" href="https://a.espncdn.com/i/teamlogos/soccer/500/364.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 리버풀 공식 색: 레드 #C8102E · 청록 #00B2A9 · 노랑 #F6EB61 */
  :root {
    --red: #c8102e; --red-deep: #8a0a1f; --red-ink: #c8102e; --teal: #00a39b; --yellow: #f6eb61;
    --bg: #f5f2ef; --card: #ffffff; --text: #1c1516; --muted: #75696a; --line: #ebe4e1;
    --red-soft: #fcebee; --good: #11845b; --good-soft: #def3ea; --warn: #9a6a00; --warn-soft: #fbf1d6;
    --bad: #c8102e; --bad-soft: #fcebee; --shadow: 0 1px 2px rgba(60, 10, 20, .06), 0 6px 20px rgba(60, 10, 20, .06);
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #120c0d; --card: #1e1517; --text: #f4eeec; --muted: #a8999a; --line: #33272a; --red-ink: #ff5c74;
      --red-soft: #3a161d; --good: #4fd19a; --good-soft: #143026; --warn: #f0c04c; --warn-soft: #362a10;
      --bad: #ff5c74; --bad-soft: #3a161d; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font);
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  [hidden] { display: none !important; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* ---------- 헤더: 레드 그라데이션 + 은은한 줄무늬 ---------- */
  .hero {
    color: #fff; padding: calc(18px + env(safe-area-inset-top)) 0 64px;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 14px, transparent 14px 28px),
      radial-gradient(120% 140% at 85% 0%, #e5193d 0%, var(--red) 45%, var(--red-deep) 100%);
  }
  .hero .brand { display: flex; align-items: center; gap: 12px; }
  /* 엠블럼이 빨간색이라 빨간 배경에 묻히지 않도록 흰 원형 배지 위에 올린다 */
  .badge {
    flex: none; display: grid; place-items: center; border-radius: 50%; background: #fff;
    box-shadow: 0 0 0 3px rgba(246, 235, 97, .9), 0 4px 14px rgba(0,0,0,.25);
  }
  .badge img { object-fit: contain; }
  .hero .badge { width: 54px; height: 54px; }
  .hero .badge img { width: 38px; height: 38px; }
  .hero h1 { margin: 0; font-weight: 800; font-size: 24px; letter-spacing: -.02em; line-height: 1.2; }
  .ynwa { font-weight: 800; letter-spacing: .14em; font-size: 11px; color: var(--yellow); margin-top: 3px; }
  .hero .updated { font-size: 12.5px; opacity: .82; margin-top: 6px; }
  /* 홈이 아닌 탭에서는 헤더를 얇게 줄여 내용이 바로 보이게 한다 */
  .hero.compact { padding: calc(10px + env(safe-area-inset-top)) 0 12px; }
  .hero.compact .badge { width: 36px; height: 36px; box-shadow: 0 0 0 2px rgba(246, 235, 97, .9); }
  .hero.compact .badge img { width: 26px; height: 26px; }
  .hero.compact h1 { font-size: 21px; }
  .hero.compact .ynwa { display: none; }
  .hero.compact .updated { margin-top: 0; font-size: 12px; }
  .hero.compact .brand { gap: 10px; }

  /* ---------- 다음 경기 카드 (헤더 위로 겹쳐 올라옴) ---------- */
  .matchday {
    margin-top: -48px; position: relative; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow);
    background: var(--card); border: 1px solid var(--line);
  }
  .matchday .bar {
    display: flex; justify-content: space-between; align-items: center; padding: 9px 16px;
    background: #1c1516; color: #fff; font-size: 12.5px; font-weight: 600;
  }
  .matchday .bar .md { font-weight: 800; letter-spacing: .12em; font-size: 12px; color: var(--yellow); }
  .matchday .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 18px 12px 6px; text-align: center; }
  .matchday .side img { width: 58px; height: 58px; object-fit: contain; }
  .matchday .side div { font-weight: 700; margin-top: 6px; font-size: 15px; }
  .matchday .side.lfc div { color: var(--red-ink); }
  .matchday .mid { padding: 0 8px; }
  .matchday .kick { font-weight: 800; font-size: 34px; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .matchday .date { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .dday {
    display: inline-block; margin-top: 8px; background: var(--yellow); color: #1c1516; border-radius: 6px;
    padding: 3px 11px; font-weight: 800; font-size: 13px;
  }
  .matchday .venue { text-align: center; font-size: 12.5px; color: var(--muted); padding: 4px 16px 14px; }

  /* ---------- 순위·폼 요약 ---------- */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 13px 15px; box-shadow: var(--shadow); }
  .stat { border-top: 3px solid var(--red); }
  .stat.ucl { border-top-color: var(--teal); }
  .label { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
  .big { font-weight: 800; font-size: 34px; line-height: 1.1; margin-top: 4px; letter-spacing: -.03em; }
  .big small { font-weight: 700; font-size: 16px; margin-left: 2px; letter-spacing: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .form { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .form .sub { white-space: nowrap; }
  .form .dots { display: flex; gap: 6px; }
  .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 800; color: #fff; }
  .dot.W { background: var(--good); } .dot.D { background: #8c8486; } .dot.L { background: var(--red); }

  /* ---------- 컵대회 진척도 ---------- */
  .comp { padding: 14px 16px; border-top: 1px solid var(--line); }
  .comp:first-child { border-top: 0; }
  .comp .top { display: flex; align-items: center; gap: 10px; }
  .comp .top b { flex: 1; font-size: 15.5px; }
  .steps { display: flex; margin: 14px 0 2px; }
  .step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .step::before { content: ""; position: absolute; top: 8px; right: 50%; width: 100%; height: 3px; background: var(--line); z-index: 0; }
  .step:first-child::before { display: none; }
  .step i {
    position: relative; z-index: 1; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center;
    background: var(--card); border: 3px solid var(--line); font-style: normal; font-size: 10px; color: #fff;
  }
  .step.done::before, .step.current::before, .step.won::before, .step.out::before, .step.skip::before { background: var(--red); }
  .step.done i { background: var(--red); border-color: var(--red); }
  .step.done, .step.current, .step.won { color: var(--text); }
  .step.current i { background: var(--yellow); border-color: var(--red); box-shadow: 0 0 0 4px var(--red-soft); }
  .step.current { color: var(--red-ink); }
  .step.won i { background: var(--yellow); border-color: var(--yellow); color: #1c1516; width: 24px; height: 24px; margin-top: -3px; }
  .step.out i { background: #8c8486; border-color: #8c8486; }
  .step.out { color: var(--muted); text-decoration: line-through; }
  .step.skip i { width: 9px; height: 9px; margin: 5px 0; border: 0; background: var(--red); opacity: .45; }
  .opp { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .opp img { width: 18px; height: 18px; object-fit: contain; }
  .opp b { color: var(--text); }
  .opp .when { flex-basis: 100%; margin-top: -3px; }
  .cups { grid-column: 1 / -1; padding: 0; overflow: hidden; }
  .cups .head { padding: 12px 15px 0; }
  .cups .comp { padding: 10px 15px 12px; border-top: 0; }
  .cups .comp + .comp { border-top: 1px solid var(--line); }
  .cups .steps { margin-top: 10px; }

  /* ---------- 하단 메뉴 바 (앱처럼 항상 화면 아래에 떠 있음) ---------- */
  #app { padding-bottom: calc(66px + env(safe-area-inset-bottom)); }
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;
    padding: 2px 4px env(safe-area-inset-bottom); border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .bottom-nav .inner { display: flex; width: 100%; max-width: 760px; }
  .bottom-nav button {
    flex: 1; position: relative; border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit;
    font-size: 11px; font-weight: 700; padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .bottom-nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .bottom-nav button[aria-selected="true"] { color: var(--red-ink); }
  .bottom-nav button[aria-selected="true"]:not(.home)::before {
    content: ""; position: absolute; top: -3px; width: 30px; height: 3px; border-radius: 0 0 3px 3px; background: var(--red);
  }
  /* 가운데 홈 버튼: 메뉴 바 위로 솟은 큰 빨간 원 */
  .bottom-nav .home { padding-top: 0; }
  .bottom-nav .home .circle {
    width: 58px; height: 58px; margin-top: -24px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: radial-gradient(120% 120% at 30% 20%, #e5193d 0%, var(--red) 55%, var(--red-deep) 100%);
    box-shadow: 0 0 0 4px var(--card), 0 6px 16px rgba(200, 16, 46, .35);
    transition: box-shadow .15s;
  }
  .bottom-nav .home .circle svg { width: 28px; height: 28px; stroke-width: 2.1; }
  .bottom-nav .home[aria-selected="true"] .circle { box-shadow: 0 0 0 4px var(--card), 0 0 0 7px var(--yellow), 0 6px 16px rgba(200, 16, 46, .35); }

  /* 순위·대회 탭 안의 선택 버튼 */
  .seg { display: flex; gap: 4px; padding: 4px; margin-bottom: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .seg button {
    flex: 1; border: 0; background: none; padding: 9px 0; border-radius: 9px; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 800; color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: var(--red); color: #fff; }
  .subpanel > h2:first-child { margin-top: 4px; }
  section.panel { display: none; padding-top: 14px; }
  #panel-home { padding-top: 0; }
  section.panel.active { display: block; }
  h2 { font-weight: 800; font-size: 17px; letter-spacing: -.01em; margin: 22px 0 8px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--red); }
  h2.teal::before { background: var(--teal); }
  section.panel > h2:first-child { margin-top: 4px; }

  /* ---------- 공통 목록 ---------- */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chips button {
    border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 6px 13px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .chips button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .news-item { display: block; padding: 13px 16px; border-top: 1px solid var(--line); }
  .news-item:first-child { border-top: 0; }
  .news-item:hover { background: var(--red-soft); }
  .news-item .ko { font-weight: 700; font-size: 15.5px; line-height: 1.45; }
  .news-item .orig { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .news-item .meta { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 5px; background: var(--red-soft); color: var(--red-ink); }
  .tag.reddit { background: #ffe9dc; color: #c4410f; }
  .tag.journo { background: var(--yellow); color: #1c1516; }

  .row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 0; }
  .pill { flex: none; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
  .tone-good { background: var(--good-soft); color: var(--good); }
  .tone-neutral { background: var(--warn-soft); color: var(--warn); }
  .tone-bad { background: var(--bad-soft); color: var(--bad); }
  .pos {
    flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    font-weight: 800; font-size: 12px; background: var(--red-soft); color: var(--red-ink);
  }

  /* ---------- 경기 ---------- */
  .match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .match:first-child { border-top: 0; }
  .match .head { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .team { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .team.away { flex-direction: row-reverse; text-align: right; }
  .team img { width: 24px; height: 24px; object-fit: contain; flex: none; }
  .team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team.lfc { color: var(--red-ink); font-weight: 800; }
  .score { font-weight: 800; font-size: 20px; line-height: 1; min-width: 70px; text-align: center; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .score.time { font-size: 16px; font-weight: 700; color: var(--muted); }
  .res { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 5px; color: #fff; }
  .res-W { background: var(--good); } .res-D { background: #8c8486; } .res-L { background: var(--red); }

  /* ---------- 순위표 ---------- */
  /* 칸이 많아 좁은 화면에서는 옆으로 밀어 볼 수 있게 하고, 순위·팀 칸은 왼쪽에 고정한다 */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 3px; text-align: center; border-top: 1px solid var(--line); white-space: nowrap; min-width: 24px; }
  th { font-size: 11.5px; color: var(--muted); font-weight: 700; border-top: 0; }
  th.rank, td.rank { position: sticky; left: 0; z-index: 1; background: var(--card); width: 30px; min-width: 30px; font-weight: 800; }
  th.tname, td.tname { position: sticky; left: 30px; z-index: 1; background: var(--card); text-align: left; min-width: 88px; max-width: 120px; }
  td.tname div { display: flex; align-items: center; gap: 6px; }
  td.tname span { overflow: hidden; text-overflow: ellipsis; }
  td.tname img { width: 19px; height: 19px; object-fit: contain; flex: none; }
  .gsep { border-left: 1px dashed var(--line); }
  td.pts { font-weight: 800; font-size: 15px; padding-right: 8px; }
  tr.me td { background: var(--red); color: #fff; font-weight: 800; }
  tr.me td.tname img { background: #fff; border-radius: 50%; padding: 2px; }
  tr.me td.rank { box-shadow: inset 4px 0 0 var(--yellow) !important; }
  tr.z-good td.rank { box-shadow: inset 3px 0 0 var(--good); }
  tr.z-neutral td.rank { box-shadow: inset 3px 0 0 var(--warn); }
  tr.z-bad td.rank { box-shadow: inset 3px 0 0 #8c8486; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 8px 2px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .empty { padding: 22px 16px; color: var(--muted); text-align: center; }
  .notice { margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  .notice.err { color: var(--bad); }
  .more { display: block; width: 100%; padding: 13px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--red-ink); font: inherit; font-weight: 800; cursor: pointer; }

  /* ---------- 맨 아래: 안필드 터널 표지판 ---------- */
  footer { text-align: center; padding: 40px 0 calc(32px + env(safe-area-inset-bottom)); }
  .anfield {
    display: inline-block; background: var(--red); color: #fff; border: 3px solid #fff; outline: 3px solid var(--red);
    padding: 10px 22px; border-radius: 4px; font-weight: 900; font-size: 20px; letter-spacing: .14em; line-height: 1;
  }
  .forget { display: block; margin: 18px auto 0; background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; }

  /* ---------- 접속 코드 화면 ---------- */
  .lock {
    position: fixed; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 24px calc(24px + env(safe-area-inset-bottom)); color: #fff; text-align: center;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 14px, transparent 14px 28px),
      radial-gradient(120% 100% at 50% 0%, #e5193d 0%, var(--red) 45%, var(--red-deep) 100%);
  }
  .lock .badge { width: 112px; height: 112px; }
  .lock .badge img { width: 78px; height: 78px; }
  .lock h2 { justify-content: center; font-size: 26px; margin: 16px 0 0; }
  .lock h2::before { display: none; }
  .lock .ynwa { font-size: 16px; margin-top: 4px; }
  .lock p { opacity: .85; font-size: 14px; margin: 22px 0 12px; }
  .lock .box { width: 100%; max-width: 320px; }
  .lock input {
    width: 100%; padding: 14px; font: inherit; font-size: 16px; border-radius: 12px; border: 0; text-align: center;
    background: #fff; color: #1c1516;
  }
  .lock button {
    width: 100%; margin-top: 10px; padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--yellow); color: #1c1516; font: inherit; font-weight: 800; font-size: 16px; letter-spacing: .08em;
  }
  .lock button:disabled { opacity: .6; }
  .lock .msg { min-height: 22px; margin-top: 10px; font-size: 14px; color: var(--yellow); font-weight: 700; }
</style>
</head>
<body>
<form class="lock" id="lock" hidden>
  <div class="badge"><img src="https://a.espncdn.com/i/teamlogos/soccer/500/364.png" alt=""></div>
  <h2>리버풀 소식</h2>
  <div class="ynwa">YOU'LL NEVER WALK ALONE</div>
  <p>접속 코드를 입력하세요. 이 기기에서는 한 번만 입력하면 돼요.</p>
  <div class="box">
    <input id="code" type="password" autocomplete="current-password" placeholder="접속 코드" required>
    <button type="submit" id="unlock">ENTER ANFIELD</button>
    <div class="msg" id="lock-msg"></div>
  </div>
</form>

<div id="app" hidden>
  <header class="hero" id="hero">
    <div class="wrap">
      <div class="brand">
        <div class="badge"><img src="https://a.espncdn.com/i/teamlogos/soccer/500/364.png" alt=""></div>
        <div>
          <h1 id="page-title">리버풀 소식</h1>
          <div class="ynwa">YOU'LL NEVER WALK ALONE</div>
          <div class="updated" id="updated"></div>
        </div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <section class="panel" id="panel-home"></section>
    <section class="panel" id="panel-news">
      <div class="seg">
        <button data-sub="news">뉴스</button>
        <button data-sub="transfer">이적 루머</button>
      </div>
      <div class="subpanel" id="sub-news"></div>
      <div class="subpanel" id="sub-transfer"></div>
    </section>
    <section class="panel" id="panel-injuries"></section>
    <section class="panel" id="panel-matches"></section>
    <section class="panel" id="panel-comps">
      <div class="seg">
        <button data-sub="tables">순위</button>
        <button data-sub="comps">대회 현황</button>
      </div>
      <div class="subpanel" id="sub-tables"></div>
      <div class="subpanel" id="sub-comps"></div>
    </section>

    <footer>
      <div class="anfield">THIS IS ANFIELD</div>
      <button class="forget" id="forget" hidden>이 기기에서 접속 코드 지우기</button>
    </footer>
  </div>

  <nav class="bottom-nav" role="tablist" id="tabs"><div class="inner">
    <button role="tab" data-tab="news" data-title="뉴스">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>뉴스</button>
    <button role="tab" data-tab="injuries" data-title="부상·결장">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>부상</button>
    <button role="tab" class="home" data-tab="home" data-title="리버풀 소식">
      <span class="circle"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>홈</button>
    <button role="tab" data-tab="matches" data-title="일정·결과">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>일정</button>
    <button role="tab" data-tab="comps" data-title="순위·대회">
      <svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M10 17h4v4h-4z"/></svg>대회</button>
  </div></nav>
</div>

<script>
const RAW = /*__DATA__*/null;
let DATA = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const kstParts = (iso) => {
  const p = {};
  new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date(iso)).forEach((x) => (p[x.type] = x.value));
  return p;
};
const fmtDate = (iso) => { const p = kstParts(iso); return `${p.month}월 ${p.day}일 (${p.weekday}) ${p.hour}:${p.minute}`; };
const fmtDay = (iso) => { const p = kstParts(iso); return `${p.month}/${p.day} (${p.weekday})`; };
const fmtLongDay = (iso) => { const p = kstParts(iso); return `${p.month}월 ${p.day}일 (${p.weekday})`; };
const fmtTime = (iso) => { const p = kstParts(iso); return `${p.hour}:${p.minute}`; };
const ago = (iso) => {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  if (m < 60 * 24) return `${Math.floor(m / 60)}시간 전`;
  return `${Math.floor(m / 1440)}일 전`;
};
const dday = (iso) => {
  const day = (d) => new Date(new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(d));
  const n = Math.round((day(new Date(iso)) - day(new Date())) / 86400000);
  return n === 0 ? "D-DAY" : n > 0 ? `D-${n}` : `D+${-n}`;
};
const img = (src) => (src ? `<img src="${esc(src)}" alt="" loading="lazy">` : "");
const isLfc = (name) => name === "리버풀";
const RES_KO = { W: "승", D: "무", L: "패" };

/* ---------- 상단 요약: 다음 경기 · 순위 · 최근 폼 ---------- */
function renderSummary() {
  const next = DATA.matches.find((m) => m.state !== "post");
  const pl = DATA.standings.pl.find((r) => r.me);
  const ucl = DATA.standings.ucl.find((r) => r.me);
  const form = DATA.matches.filter((m) => m.result).slice(-5);
  let html = "";
  if (next) {
    const live = next.state === "in";
    html += `<div class="matchday">
      <div class="bar"><span class="md">${live ? "LIVE" : "NEXT MATCH"}</span><span>${esc(next.comp)}</span></div>
      <div class="vs">
        <div class="side ${isLfc(next.home) ? "lfc" : ""}">${img(next.home_logo)}<div>${esc(next.home)}</div></div>
        <div class="mid">
          <div class="kick">${live ? `${esc(next.home_score)} - ${esc(next.away_score)}` : fmtTime(next.date)}</div>
          <div class="date">${fmtLongDay(next.date)}</div>
          <span class="dday">${live ? esc(next.detail || "LIVE") : dday(next.date)}</span>
        </div>
        <div class="side ${isLfc(next.away) ? "lfc" : ""}">${img(next.away_logo)}<div>${esc(next.away)}</div></div>
      </div>
      ${next.venue ? `<div class="venue">${esc(next.venue)}</div>` : ""}
    </div>`;
  }
  html += `<div class="stats">`;
  if (pl) html += `<div class="card stat"><div class="label">프리미어리그</div><div class="big">${pl.rank}<small>위</small></div><div class="sub">승점 ${esc(pl.pts)} · ${esc(pl.p)}경기</div></div>`;
  if (ucl) html += `<div class="card stat ucl"><div class="label">챔피언스리그</div><div class="big">${ucl.rank}<small>위</small></div><div class="sub">승점 ${esc(ucl.pts)} · ${esc(ucl.p)}경기</div></div>`;
  if (form.length) {
    html += `<div class="card form"><div><div class="label">최근 ${form.length}경기</div><div class="sub">오른쪽이 최근</div></div>
      <div class="dots">${form.map((m) => `<span class="dot ${m.result}" title="${esc(m.home)} ${esc(m.home_score)}-${esc(m.away_score)} ${esc(m.away)}">${RES_KO[m.result]}</span>`).join("")}</div></div>`;
  }
  const cups = DATA.competitions.filter((c) => c.steps && c.alive);
  if (cups.length) {
    html += `<div class="card cups"><div class="head label">참가 중인 컵대회</div>${cups.map((c) => compHtml(c, true)).join("")}</div>`;
  }
  html += `</div>`;
  document.getElementById("panel-home").innerHTML = html;
  document.getElementById("updated").textContent = `${fmtDate(DATA.generated)} 업데이트 · ${ago(DATA.generated)}`;
}

function newsItemHtml(n, withTag) {
  return `<a class="news-item" href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">
    <div class="ko">${esc(n.title_ko || n.title)}</div>
    ${n.title_ko ? `<div class="orig">${esc(n.title)}</div>` : ""}
    <div class="meta">${n.journalist ? `<span class="tag journo">✍ ${esc(n.journalist)}</span>` : ""}${withTag ? `<span class="tag ${n.group === "레딧" ? "reddit" : ""}">${esc(n.group)}</span>` : ""}<span>${esc(n.journalist ? "r/LiverpoolFC" : n.source)}</span><span>${ago(n.published)}</span></div>
  </a>`;
}

/* ---------- 뉴스 · 이적 루머 (같은 모양의 목록) ---------- */
const FEEDS = {
  news: {
    items: () => DATA.news, groups: () => DATA.news_groups, errors: () => DATA.news_errors,
    notice: "제목을 누르면 원문 기사로 이동해요. 제목은 구글 번역이라 어색할 수 있어요.",
  },
  transfer: {
    items: () => DATA.transfers || [], groups: () => DATA.transfer_groups || [], errors: () => DATA.transfer_errors || [],
    notice: "✍ 기자 보도: r/LiverpoolFC가 기자별 신뢰도 등급을 매겨 관리하는 글이에요. 언론 루머: 각국 언론의 이적 기사로, 근거가 약한 것도 섞여 있어요.",
  },
};
const feedState = {};
function renderFeed(name) {
  const feed = FEEDS[name];
  const st = feedState[name] || (feedState[name] = { group: store.get("group-" + name) || "전체", limit: 40 });
  const el = document.getElementById("sub-" + name);
  const groups = ["전체", ...feed.groups()];
  if (!groups.includes(st.group)) st.group = "전체";
  const items = feed.items().filter((n) => st.group === "전체" || n.group === st.group);
  const shown = items.slice(0, st.limit);
  let html = `<div class="chips">${groups.map((g) => `<button data-group="${esc(g)}" aria-pressed="${g === st.group}">${esc(g)}</button>`).join("")}</div>`;
  html += `<div class="list">`;
  if (!shown.length) html += `<div class="empty">표시할 기사가 없어요.</div>`;
  html += shown.map((n) => newsItemHtml(n, st.group === "전체")).join("");
  if (items.length > st.limit) html += `<button class="more">더 보기 (${items.length - st.limit}건 남음)</button>`;
  html += `</div>`;
  if (feed.errors().length) html += `<div class="notice err">이번에 불러오지 못한 곳: ${feed.errors().map(esc).join(", ")}</div>`;
  html += `<div class="notice">${feed.notice}</div>`;
  el.innerHTML = html;
  el.querySelectorAll(".chips button").forEach((b) => b.addEventListener("click", () => {
    st.group = b.dataset.group; st.limit = 40; store.set("group-" + name, st.group); renderFeed(name);
  }));
  const more = el.querySelector(".more");
  if (more) more.addEventListener("click", () => { st.limit += 40; renderFeed(name); });
}
function renderNews() { renderFeed("news"); renderFeed("transfer"); }

/* ---------- 부상·결장 ---------- */
function renderInjuries() {
  const el = document.getElementById("panel-injuries");
  if (DATA.injuries === null) { el.innerHTML = `<div class="list"><div class="empty">부상자 정보를 불러오지 못했어요.</div></div>`; return; }
  const tone = { s: "bad", i: "bad", d: "neutral", u: "neutral", n: "neutral" };
  let html = `<div class="list">`;
  if (!DATA.injuries.length) html += `<div class="empty">현재 부상·결장 선수가 없어요. 완전체!</div>`;
  for (const p of DATA.injuries) {
    const pill = p.status === "d" && p.chance != null ? `출전 ${p.chance}%` : p.status_ko;
    html += `<div class="row">
      <div class="pos">${esc(p.pos)}</div>
      <div class="grow">
        <div><b>${esc(p.name)}</b> <span class="sub">${esc(p.full)}</span></div>
        <div>${esc(p.news_ko || p.news)}</div>
        ${p.news_ko ? `<div class="sub">${esc(p.news)}${p.added ? " · " + ago(p.added) + " 갱신" : ""}</div>` : ""}
      </div>
      <span class="pill tone-${tone[p.status] || "neutral"}">${esc(pill)}</span>
    </div>`;
  }
  html += `</div><div class="notice">출처: 프리미어리그 공식 판타지(FPL). 프리미어리그 경기 기준이라 컵대회 전용 징계는 빠질 수 있어요.</div>`;
  el.innerHTML = html;
}

/* ---------- 일정·결과 ---------- */
function matchRow(m) {
  const center = m.state === "pre"
    ? `<div class="score time">${fmtTime(m.date)}</div>`
    : `<div class="score">${esc(m.home_score)} - ${esc(m.away_score)}</div>`;
  const live = m.state === "in" ? ` · <b style="color:var(--red-ink)">진행 중 ${esc(m.detail || "")}</b>` : "";
  return `<div class="match">
    <div class="head"><span>${fmtDay(m.date)} · ${esc(m.comp)}${live}</span>${m.result ? `<span class="res res-${m.result}">${RES_KO[m.result]}</span>` : ""}</div>
    <div class="team ${isLfc(m.home) ? "lfc" : ""}">${img(m.home_logo)}<span>${esc(m.home)}</span></div>
    ${center}
    <div class="team away ${isLfc(m.away) ? "lfc" : ""}">${img(m.away_logo)}<span>${esc(m.away)}</span></div>
  </div>`;
}
function renderMatches() {
  const el = document.getElementById("panel-matches");
  const upcoming = DATA.matches.filter((m) => m.state !== "post");
  const done = DATA.matches.filter((m) => m.state === "post").reverse();
  const block = (list, emptyText) => `<div class="list">${list.length ? list.map(matchRow).join("") : `<div class="empty">${emptyText}</div>`}</div>`;
  el.innerHTML = `<h2>다가오는 경기</h2>${block(upcoming.slice(0, 10), "예정된 경기가 없어요.")}
    <h2>최근 결과</h2>${block(done.slice(0, 15), "아직 치른 경기가 없어요.")}
    <div class="notice">시간은 모두 한국 시간이에요.</div>`;
}

/* ---------- 순위 ---------- */
function tableHtml(rows, zoneOf) {
  if (!rows.length) return `<div class="list"><div class="empty">순위를 불러오지 못했어요.</div></div>`;
  return `<div class="list table-scroll"><table>
    <thead><tr><th class="rank">#</th><th class="tname">팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th class="gsep">득점</th><th>실점</th><th>득실</th><th>승점</th></tr></thead>
    <tbody>${rows.map((r) => `<tr class="${r.me ? "me" : ""} ${zoneOf ? "z-" + zoneOf(r.rank) : ""}">
      <td class="rank">${r.rank}</td><td class="tname" title="${esc(r.team)}"><div>${img(r.logo)}<span>${esc(r.short || r.team)}</span></div></td>
      <td>${esc(r.p)}</td><td>${esc(r.w)}</td><td>${esc(r.d)}</td><td>${esc(r.l)}</td>
      <td class="gsep">${esc(r.gf ?? "")}</td><td>${esc(r.ga ?? "")}</td><td>${esc(r.gd)}</td><td class="pts">${esc(r.pts)}</td>
    </tr>`).join("")}</tbody></table></div>`;
}
function renderTables() {
  const el = document.getElementById("sub-tables");
  const plZone = (r) => (r <= 4 ? "good" : r >= 18 ? "bad" : "");
  const uclZone = (r) => (r <= 8 ? "good" : r <= 24 ? "neutral" : "bad");
  el.innerHTML = `<h2>프리미어리그</h2>${tableHtml(DATA.standings.pl, plZone)}
    <div class="legend"><span><i style="background:var(--good)"></i>챔스 진출권(1~4위)</span><span><i style="background:#8c8486"></i>강등권</span></div>
    <h2 class="teal">챔피언스리그 리그 페이즈</h2>${tableHtml(DATA.standings.ucl, uclZone)}
    <div class="legend"><span><i style="background:var(--good)"></i>16강 직행 (1~8위)</span><span><i style="background:var(--warn)"></i>플레이오프 (9~24위)</span><span><i style="background:#8c8486"></i>탈락 (25~36위)</span></div>`;
}

/* ---------- 대회 현황 ---------- */
function stepsHtml(steps) {
  const mark = { done: "", current: "", won: "🏆", out: "✕", skip: "", todo: "" };
  return `<div class="steps">${steps.map((s) => `<div class="step ${s.state}"><i>${mark[s.state]}</i>${esc(s.label)}</div>`).join("")}</div>`;
}
function oppHtml(n) {
  if (!n) return "";
  const where = n.home ? "홈" : "원정";
  const round = [n.round, n.leg].filter(Boolean).join(" ");
  return `<div class="opp"><span>다음 상대</span>${img(n.opp_logo)}<b>${esc(n.opp)}</b><span>(${where})</span>
    <span class="when">${round ? esc(round) + " · " : ""}${fmtDate(n.date)}</span></div>`;
}
function compHtml(c, compact) {
  return `<div class="comp">
    <div class="top"><b>${esc(c.name)}</b>${c.status ? `<span class="pill tone-${c.tone}">${esc(c.status)}</span>` : ""}</div>
    ${!compact && c.detail ? `<div class="sub">${esc(c.detail)}</div>` : ""}
    ${c.steps ? stepsHtml(c.steps) : ""}
    ${oppHtml(c.next)}
  </div>`;
}
function renderComps() {
  const el = document.getElementById("sub-comps");
  let html = `<div class="list">${DATA.competitions.map((c) => compHtml(c, false)).join("")}</div>`;
  if (DATA.errors.length) html += `<div class="notice err">이번에 불러오지 못한 정보: ${DATA.errors.map(esc).join(", ")}</div>`;
  el.innerHTML = html;
}

/* ---------- 탭 ---------- */
function showTab(name) {
  let title = "리버풀 소식";
  document.querySelectorAll("#tabs button").forEach((b) => {
    b.setAttribute("aria-selected", String(b.dataset.tab === name));
    if (b.dataset.tab === name) title = b.dataset.title;
  });
  document.querySelectorAll("section.panel").forEach((s) => s.classList.toggle("active", s.id === "panel-" + name));
  document.getElementById("hero").classList.toggle("compact", name !== "home");
  document.getElementById("page-title").textContent = title;
}
function goTab(name) {
  showTab(name);
  window.scrollTo(0, 0);
}
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => goTab(b.dataset.tab)));

/* 순위·대회 탭 안에서 순위 / 대회 현황 고르기 (마지막 선택을 기억) */
function showSub(panel, name) {
  panel.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sub === name)));
  panel.querySelectorAll(".subpanel").forEach((s) => (s.hidden = s.id !== "sub-" + name));
  store.set("sub-" + panel.id, name);
}
function restoreSub(panel) {
  const subs = [...panel.querySelectorAll(".seg button")].map((b) => b.dataset.sub);
  const saved = store.get("sub-" + panel.id);
  showSub(panel, subs.includes(saved) ? saved : subs[0]);
}
document.querySelectorAll(".seg").forEach((seg) => seg.querySelectorAll("button").forEach((b) =>
  b.addEventListener("click", () => showSub(seg.closest("section"), b.dataset.sub))));

function start(data) {
  DATA = data;
  document.getElementById("lock").hidden = true;
  document.getElementById("app").hidden = false;
  renderSummary(); renderNews(); renderInjuries(); renderMatches(); renderTables(); renderComps();
  document.querySelectorAll(".seg").forEach((seg) => restoreSub(seg.closest("section")));
  showTab("home");  // 열 때는 항상 홈에서 시작
}

/* ---------- 접속 코드 (build.py 의 encrypt 와 같은 방식으로 푼다) ---------- */
async function unlock(code) {
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: bytes(RAW.salt), iterations: RAW.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(RAW.iv) }, key, bytes(RAW.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function boot() {
  if (!RAW.locked) { start(RAW); return; }
  document.getElementById("forget").hidden = false;
  const saved = store.get("code");
  if (saved) {
    try { start(await unlock(saved)); return; } catch (e) { store.set("code", ""); }
  }
  const form = document.getElementById("lock");
  const input = document.getElementById("code");
  const btn = document.getElementById("unlock");
  const msg = document.getElementById("lock-msg");
  form.hidden = false;
  input.focus();
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const code = input.value.trim();
    btn.disabled = true; msg.textContent = "";
    try {
      const data = await unlock(code);
      store.set("code", code);
      start(data);
    } catch (e) {
      msg.textContent = "코드가 맞지 않아요.";
      btn.disabled = false; input.select();
    }
  });
}
document.getElementById("forget").addEventListener("click", () => {
  store.set("code", "");
  location.reload();
});
boot();
</script>
</body>
</html>
