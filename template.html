<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c8102e">
<title>리버풀 소식</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c8102e'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3ELFC%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f5f3; --card: #ffffff; --text: #1d1b1a; --muted: #6f6a66; --line: #e7e3df;
    --red: #c8102e; --red-soft: #fbe9ec; --good: #1a7f4b; --good-soft: #e3f4ea;
    --warn: #a86400; --warn-soft: #fdf1dc; --bad: #b3261e; --bad-soft: #fbe5e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141212; --card: #1e1b1b; --text: #f1eeec; --muted: #a29b97; --line: #332e2d;
      --red: #ef3e57; --red-soft: #3a1a20; --good: #5cc98d; --good-soft: #17301f;
      --warn: #f0b44c; --warn-soft: #362812; --bad: #ff7a70; --bad-soft: #3a1b18;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
  header.top { background: var(--red); color: #fff; }
  header.top .wrap { padding-top: 20px; padding-bottom: 16px; }
  header.top h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  header.top .updated { font-size: 13px; opacity: 0.85; margin-top: 2px; }

  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .summary .next { grid-column: 1 / -1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .big { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .next-teams { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-weight: 700; font-size: 17px; flex-wrap: wrap; }
  .next-teams img { width: 26px; height: 26px; object-fit: contain; }
  .dday { display: inline-block; background: var(--red); color: #fff; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 700; margin-left: 6px; vertical-align: 2px; }

  nav.tabs {
    position: sticky; top: 0; z-index: 5; background: var(--bg); margin: 18px -16px 0; padding: 10px 16px;
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line);
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button, .chips button {
    flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  nav.tabs button[aria-selected="true"], .chips button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
  section.panel { display: none; padding-top: 14px; }
  section.panel.active { display: block; }
  h2 { font-size: 16px; margin: 20px 0 8px; }
  h2:first-child { margin-top: 4px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chips button { padding: 5px 12px; font-size: 13px; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .news-item { display: block; padding: 12px 16px; border-top: 1px solid var(--line); }
  .news-item:first-child { border-top: 0; }
  .news-item:hover { background: var(--red-soft); }
  .news-item .ko { font-weight: 650; font-size: 15.5px; }
  .news-item .orig { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .news-item .meta { color: var(--muted); font-size: 12px; margin-top: 5px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--red-soft); color: var(--red); }

  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 0; }
  .pill { flex: none; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .tone-good { background: var(--good-soft); color: var(--good); }
  .tone-neutral { background: var(--warn-soft); color: var(--warn); }
  .tone-bad { background: var(--bad-soft); color: var(--bad); }
  .sub { color: var(--muted); font-size: 13px; }
  .pos { flex: none; width: 30px; font-size: 12px; font-weight: 700; color: var(--muted); }

  .match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .match:first-child { border-top: 0; }
  .match .head { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .team { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .team.away { flex-direction: row-reverse; text-align: right; }
  .team img { width: 22px; height: 22px; object-fit: contain; flex: none; }
  .team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team.lfc { color: var(--red); }
  .score { font-weight: 800; font-size: 17px; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  .score.time { font-size: 14px; font-weight: 700; }
  .res { font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 5px; }
  .res-W { background: var(--good-soft); color: var(--good); }
  .res-D { background: var(--warn-soft); color: var(--warn); }
  .res-L { background: var(--bad-soft); color: var(--bad); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 6px; text-align: center; border-top: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; border-top: 0; }
  td.tname { text-align: left; width: 100%; max-width: 0; }
  td.tname div { display: flex; align-items: center; gap: 8px; }
  td.tname span { overflow: hidden; text-overflow: ellipsis; }
  td.tname img { width: 20px; height: 20px; object-fit: contain; flex: none; }
  @media (max-width: 480px) { .wdl { display: none; } th, td { padding: 8px 5px; } }
  tr.me td { background: var(--red-soft); font-weight: 700; }
  td.rank { width: 36px; font-weight: 700; position: relative; }
  tr.z-good td.rank { box-shadow: inset 3px 0 0 var(--good); }
  tr.z-neutral td.rank { box-shadow: inset 3px 0 0 var(--warn); }
  tr.z-bad td.rank { box-shadow: inset 3px 0 0 var(--bad); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 8px 2px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .empty { padding: 20px 16px; color: var(--muted); text-align: center; }
  .notice { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .notice.err { color: var(--bad); }
  .lock { max-width: 360px; margin: 48px auto 0; padding: 0 16px; text-align: center; }
  .lock p { color: var(--muted); margin: 6px 0 18px; }
  .lock input {
    width: 100%; padding: 13px 14px; font: inherit; font-size: 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); text-align: center;
  }
  .lock button {
    width: 100%; margin-top: 10px; padding: 13px; border: 0; border-radius: 12px;
    background: var(--red); color: #fff; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .lock button:disabled { opacity: 0.6; }
  .lock .msg { min-height: 22px; margin-top: 10px; font-size: 14px; color: var(--bad); }
  .forget { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 24px; }
  [hidden] { display: none !important; }
  .more { display: block; width: 100%; padding: 12px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--red); font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>리버풀 소식</h1>
    <div class="updated" id="updated"></div>
  </div>
</header>

<form class="lock" id="lock" hidden>
  <h2>접속 코드를 입력하세요</h2>
  <p>이 기기에서 한 번만 입력하면 다음부터는 자동으로 열려요.</p>
  <input id="code" type="password" autocomplete="current-password" placeholder="접속 코드" required>
  <button type="submit" id="unlock">열기</button>
  <div class="msg" id="lock-msg"></div>
</form>

<div class="wrap" id="app" hidden>
  <div class="summary" id="summary"></div>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="news">뉴스</button>
    <button role="tab" data-tab="injuries">부상·결장</button>
    <button role="tab" data-tab="matches">일정·결과</button>
    <button role="tab" data-tab="tables">순위</button>
    <button role="tab" data-tab="comps">대회 현황</button>
  </nav>

  <section class="panel" id="panel-news"></section>
  <section class="panel" id="panel-injuries"></section>
  <section class="panel" id="panel-matches"></section>
  <section class="panel" id="panel-tables"></section>
  <section class="panel" id="panel-comps"></section>
  <button class="forget" id="forget" hidden>이 기기에서 접속 코드 지우기</button>
</div>

<script>
const RAW = /*__DATA__*/null;
let DATA = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const kstParts = (iso) => {
  const p = {};
  new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date(iso)).forEach((x) => (p[x.type] = x.value));
  return p;
};
const fmtDate = (iso) => { const p = kstParts(iso); return `${p.month}월 ${p.day}일 (${p.weekday}) ${p.hour}:${p.minute}`; };
const fmtDay = (iso) => { const p = kstParts(iso); return `${p.month}/${p.day} (${p.weekday})`; };
const fmtTime = (iso) => { const p = kstParts(iso); return `${p.hour}:${p.minute}`; };
const ago = (iso) => {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  if (m < 60 * 24) return `${Math.floor(m / 60)}시간 전`;
  return `${Math.floor(m / 1440)}일 전`;
};
const dday = (iso) => {
  const day = (d) => new Date(new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul" }).format(d));
  const n = Math.round((day(new Date(iso)) - day(new Date())) / 86400000);
  return n === 0 ? "오늘" : n > 0 ? `D-${n}` : `D+${-n}`;
};
const img = (src) => (src ? `<img src="${esc(src)}" alt="" loading="lazy">` : "");
const isLfc = (name) => name === "리버풀";

/* ---------- 상단 요약 ---------- */
function renderSummary() {
  const next = DATA.matches.find((m) => m.state !== "post");
  const pl = DATA.standings.pl.find((r) => r.me);
  const ucl = DATA.standings.ucl.find((r) => r.me);
  let html = "";
  if (next) {
    html += `<div class="card next">
      <div class="label">다음 경기 · ${esc(next.comp)}</div>
      <div class="next-teams">${img(next.home_logo)}${esc(next.home)} <span class="sub">vs</span> ${img(next.away_logo)}${esc(next.away)}</div>
      <div class="sub">${fmtDate(next.date)} <span class="dday">${dday(next.date)}</span>${next.venue ? " · " + esc(next.venue) : ""}</div>
    </div>`;
  }
  if (pl) html += `<div class="card"><div class="label">프리미어리그</div><div class="big">${pl.rank}위</div><div class="sub">승점 ${esc(pl.pts)} · ${esc(pl.p)}경기</div></div>`;
  if (ucl) html += `<div class="card"><div class="label">챔피언스리그</div><div class="big">${ucl.rank}위</div><div class="sub">승점 ${esc(ucl.pts)} · ${esc(ucl.p)}경기</div></div>`;
  document.getElementById("summary").innerHTML = html;
  document.getElementById("updated").textContent = `${fmtDate(DATA.generated)} 업데이트 (${ago(DATA.generated)})`;
}

/* ---------- 뉴스 ---------- */
let newsGroup = store.get("newsGroup") || "전체";
let newsLimit = 40;
function renderNews() {
  const el = document.getElementById("panel-news");
  const groups = ["전체", ...DATA.news_groups];
  if (!groups.includes(newsGroup)) newsGroup = "전체";
  const items = DATA.news.filter((n) => newsGroup === "전체" || n.group === newsGroup);
  const shown = items.slice(0, newsLimit);
  let html = `<div class="chips">${groups.map((g) => `<button data-group="${esc(g)}" aria-pressed="${g === newsGroup}">${esc(g)}</button>`).join("")}</div>`;
  html += `<div class="list">`;
  if (!shown.length) html += `<div class="empty">표시할 기사가 없어요.</div>`;
  for (const n of shown) {
    html += `<a class="news-item" href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">
      <div class="ko">${esc(n.title_ko || n.title)}</div>
      ${n.title_ko ? `<div class="orig">${esc(n.title)}</div>` : ""}
      <div class="meta">${newsGroup === "전체" ? `<span class="tag">${esc(n.group)}</span>` : ""}<span>${esc(n.source)}</span><span>${ago(n.published)}</span></div>
    </a>`;
  }
  if (items.length > newsLimit) html += `<button class="more" id="more">더 보기 (${items.length - newsLimit}건 남음)</button>`;
  html += `</div>`;
  if (DATA.news_errors.length) html += `<div class="notice err">이번에 불러오지 못한 곳: ${DATA.news_errors.map(esc).join(", ")}</div>`;
  html += `<div class="notice">제목을 누르면 원문 기사로 이동해요. 제목은 구글 번역이라 어색할 수 있어요.</div>`;
  el.innerHTML = html;
  el.querySelectorAll(".chips button").forEach((b) => b.addEventListener("click", () => {
    newsGroup = b.dataset.group; newsLimit = 40; store.set("newsGroup", newsGroup); renderNews();
  }));
  const more = document.getElementById("more");
  if (more) more.addEventListener("click", () => { newsLimit += 40; renderNews(); });
}

/* ---------- 부상·결장 ---------- */
function renderInjuries() {
  const el = document.getElementById("panel-injuries");
  if (DATA.injuries === null) { el.innerHTML = `<div class="list"><div class="empty">부상자 정보를 불러오지 못했어요.</div></div>`; return; }
  const tone = { s: "bad", i: "bad", d: "neutral", u: "neutral", n: "neutral" };
  let html = `<div class="list">`;
  if (!DATA.injuries.length) html += `<div class="empty">현재 부상·결장 선수가 없어요.</div>`;
  for (const p of DATA.injuries) {
    const pill = p.status === "d" && p.chance != null ? `출전 ${p.chance}%` : p.status_ko;
    html += `<div class="row">
      <div class="pos">${esc(p.pos)}</div>
      <div class="grow">
        <div><b>${esc(p.name)}</b> <span class="sub">${esc(p.full)}</span></div>
        <div>${esc(p.news_ko || p.news)}</div>
        ${p.news_ko ? `<div class="sub">${esc(p.news)}${p.added ? " · " + ago(p.added) + " 갱신" : ""}</div>` : ""}
      </div>
      <span class="pill tone-${tone[p.status] || "neutral"}">${esc(pill)}</span>
    </div>`;
  }
  html += `</div><div class="notice">출처: 프리미어리그 공식 판타지(FPL). 프리미어리그 경기 기준이라 컵대회 전용 징계는 빠질 수 있어요.</div>`;
  el.innerHTML = html;
}

/* ---------- 일정·결과 ---------- */
function matchRow(m) {
  const center = m.state === "pre"
    ? `<div class="score time">${fmtTime(m.date)}</div>`
    : `<div class="score">${esc(m.home_score)} - ${esc(m.away_score)}</div>`;
  const live = m.state === "in" ? ` · <b style="color:var(--red)">진행 중 ${esc(m.detail || "")}</b>` : "";
  return `<div class="match">
    <div class="head"><span>${fmtDay(m.date)} · ${esc(m.comp)}${live}</span>${m.result ? `<span class="res res-${m.result}">${{ W: "승", D: "무", L: "패" }[m.result]}</span>` : ""}</div>
    <div class="team ${isLfc(m.home) ? "lfc" : ""}">${img(m.home_logo)}<span>${esc(m.home)}</span></div>
    ${center}
    <div class="team away ${isLfc(m.away) ? "lfc" : ""}">${img(m.away_logo)}<span>${esc(m.away)}</span></div>
  </div>`;
}
function renderMatches() {
  const el = document.getElementById("panel-matches");
  const upcoming = DATA.matches.filter((m) => m.state !== "post");
  const done = DATA.matches.filter((m) => m.state === "post").reverse();
  const block = (list, emptyText) => `<div class="list">${list.length ? list.map(matchRow).join("") : `<div class="empty">${emptyText}</div>`}</div>`;
  el.innerHTML = `<h2>다가오는 경기</h2>${block(upcoming.slice(0, 10), "예정된 경기가 없어요.")}
    <h2>최근 결과</h2>${block(done.slice(0, 15), "아직 치른 경기가 없어요.")}
    <div class="notice">시간은 모두 한국 시간이에요.</div>`;
}

/* ---------- 순위 ---------- */
function tableHtml(rows, zoneOf) {
  if (!rows.length) return `<div class="list"><div class="empty">순위를 불러오지 못했어요.</div></div>`;
  return `<div class="list table-wrap"><table>
    <thead><tr><th>#</th><th style="text-align:left">팀</th><th>경기</th><th class="wdl">승</th><th class="wdl">무</th><th class="wdl">패</th><th>득실</th><th>승점</th></tr></thead>
    <tbody>${rows.map((r) => `<tr class="${r.me ? "me" : ""} ${zoneOf ? "z-" + zoneOf(r.rank) : ""}">
      <td class="rank">${r.rank}</td><td class="tname"><div>${img(r.logo)}<span>${esc(r.team)}</span></div></td>
      <td>${esc(r.p)}</td><td class="wdl">${esc(r.w)}</td><td class="wdl">${esc(r.d)}</td><td class="wdl">${esc(r.l)}</td><td>${esc(r.gd)}</td><td><b>${esc(r.pts)}</b></td>
    </tr>`).join("")}</tbody></table></div>`;
}
function renderTables() {
  const el = document.getElementById("panel-tables");
  const plZone = (r) => (r <= 4 ? "good" : r >= 18 ? "bad" : "");
  const uclZone = (r) => (r <= 8 ? "good" : r <= 24 ? "neutral" : "bad");
  el.innerHTML = `<h2>프리미어리그</h2>${tableHtml(DATA.standings.pl, plZone)}
    <div class="legend"><span><i style="background:var(--good)"></i>챔스 진출권(1~4위)</span><span><i style="background:var(--bad)"></i>강등권</span></div>
    <h2>챔피언스리그 리그 페이즈</h2>${tableHtml(DATA.standings.ucl, uclZone)}
    <div class="legend"><span><i style="background:var(--good)"></i>16강 직행 (1~8위)</span><span><i style="background:var(--warn)"></i>플레이오프 (9~24위)</span><span><i style="background:var(--bad)"></i>탈락 (25~36위)</span></div>`;
}

/* ---------- 대회 현황 ---------- */
function renderComps() {
  const el = document.getElementById("panel-comps");
  let html = `<div class="list">`;
  for (const c of DATA.competitions) {
    html += `<div class="row"><div class="grow">
      <div><b>${esc(c.name)}</b></div>
      ${c.detail ? `<div class="sub">${esc(c.detail)}</div>` : ""}
      ${c.next ? `<div class="sub">다음: ${esc(c.next.home)} vs ${esc(c.next.away)} · ${fmtDate(c.next.date)}</div>` : ""}
    </div>${c.status ? `<span class="pill tone-${c.tone}">${esc(c.status)}</span>` : ""}</div>`;
  }
  html += `</div>`;
  if (DATA.errors.length) html += `<div class="notice err">이번에 불러오지 못한 정보: ${DATA.errors.map(esc).join(", ")}</div>`;
  el.innerHTML = html;
}

/* ---------- 탭 ---------- */
function showTab(name) {
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  document.querySelectorAll("section.panel").forEach((s) => s.classList.toggle("active", s.id === "panel-" + name));
  store.set("tab", name);
}
document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => {
  showTab(b.dataset.tab);
  const navTop = document.getElementById("tabs").offsetTop;
  if (window.scrollY > navTop) window.scrollTo(0, navTop);
}));

function start(data) {
  DATA = data;
  document.getElementById("lock").hidden = true;
  document.getElementById("app").hidden = false;
  renderSummary(); renderNews(); renderInjuries(); renderMatches(); renderTables(); renderComps();
  const savedTab = store.get("tab");
  showTab(document.getElementById("panel-" + savedTab) ? savedTab : "news");
}

/* ---------- 접속 코드 (build.py 의 encrypt 와 같은 방식으로 푼다) ---------- */
async function unlock(code) {
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: bytes(RAW.salt), iterations: RAW.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(RAW.iv) }, key, bytes(RAW.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function boot() {
  if (!RAW.locked) { start(RAW); return; }
  document.getElementById("forget").hidden = false;
  const saved = store.get("code");
  if (saved) {
    try { start(await unlock(saved)); return; } catch (e) { store.set("code", ""); }
  }
  const form = document.getElementById("lock");
  const input = document.getElementById("code");
  const btn = document.getElementById("unlock");
  const msg = document.getElementById("lock-msg");
  form.hidden = false;
  input.focus();
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const code = input.value.trim();
    btn.disabled = true; msg.textContent = "";
    try {
      const data = await unlock(code);
      store.set("code", code);
      start(data);
    } catch (e) {
      msg.textContent = "코드가 맞지 않아요.";
      btn.disabled = false; input.select();
    }
  });
}
document.getElementById("forget").addEventListener("click", () => {
  store.set("code", "");
  location.reload();
});
boot();
</script>
